<!DOCTYPE html>
<!-- ============================================================
  G178 — YES 5G "DATA MERGE" · 2048-Style Tile-Merge
  Mechanic: 2048 tile-merge LOGIC (public-domain, MIT-origin genre) — swipe to
  slide tiles; equal tiles merge & double; reach a target tile. NO trademarked
  art/names. Brand-skinned as merging data tiers up to a 5G tile. NEW FAMILY
  (sliding-merge) — 0 prior files. Surface: in-app interstitial. Grade B.
  Lifecycle: conversion (telco). SETS: {{profile.merge_best}}. PROMOS at target tile.
  Brand: Yes 5G yellow #FFE600 (verified)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#ffe600"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yes 5G · Data Merge</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ylw:var(--cfg-accent,#ffe600);--blk:#111;--mag:#E6007E;--cyan:#00C2FF;--grn:#2FA85B;--ink:#141414;--paper:#15151b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;min-height:100vh;background:linear-gradient(165deg,#1a1a22,#0a0a0e);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(6,6,10,.66);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:88vw;max-width:358px;background:#15151b;border-radius:24px;box-shadow:0 26px 64px rgba(0,0,0,.6);overflow:hidden;color:#fff;border:1px solid #2a2a35}
.hd{padding:13px 20px 6px;position:relative;text-align:center}
.brand{font:700 12px 'Chakra Petch';letter-spacing:2px;color:var(--ylw);margin-bottom:3px}
.x{position:absolute;top:11px;right:14px;width:30px;height:30px;border:0;border-radius:50%;background:#ffffff16;color:#fff;cursor:pointer}
h1{font-family:'Chakra Petch';font-weight:700;font-size:19px}
.hd p{font-size:10.5px;color:#b0b0c0;margin-top:2px;line-height:1.35}
.hud{display:flex;justify-content:space-between;padding:3px 24px;font:700 12px 'Chakra Petch';color:var(--ylw)}
.gridwrap{display:flex;justify-content:center;padding:8px 0 4px}
.grid{display:grid;grid-template-columns:repeat(4,58px);grid-template-rows:repeat(4,58px);gap:7px;background:#0c0c10;padding:7px;border-radius:12px;touch-action:none}
.tile{border-radius:9px;display:flex;align-items:center;justify-content:center;font:800 16px 'Chakra Petch';background:#22222c;color:#fff;transition:.1s}
.tile[data-v="0"]{background:#1c1c24;color:transparent}
.body{padding:6px 20px 14px;text-align:center}
.status{font:700 10.5px Inter;color:#b0b0c0;min-height:14px;margin-bottom:7px}
.status b{color:var(--ylw)}
.btn{width:100%;border:0;border-radius:13px;padding:12px;background:var(--ylw);color:#141414;font:700 13px 'Chakra Petch';cursor:pointer;box-shadow:0 5px 0 #b3a200}
.btn:disabled{opacity:.55;box-shadow:none}
.hint{font-size:9px;color:#70708a;margin-top:5px}
.ctlog{margin-top:8px;font:700 9.5px ui-monospace,monospace;color:#a0a0b8;background:#1c1c24;border-radius:8px;padding:6px 9px;text-align:left;min-height:28px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">YES 5G</div>
    <h1>Data Merge 📶</h1>
    <p>Swipe to merge matching data tiles. Double your way up to the 5G tile (2048) for a bonus!</p>
  </div>
  <div class="hud"><span>Score: <span id="score">0</span></span><span>Best tile: <span id="best">2</span></span></div>
  <div class="gridwrap"><div class="grid" id="grid"></div></div>
  <div class="body">
    <div class="status" id="status">Tap Start, then swipe to merge!</div>
    <button class="btn" id="start">START</button>
    <div class="hint">Swipe ◀▶▲▼ (or arrow keys) · merge equal tiles · reach 2048</div>
    
  </div>
</div></div>
<script>
/* 2048 tile-merge LOGIC (public-domain genre). 4x4, swipe-slide-merge, spawn 2/4.
   IP-neutral data-tier labels. SETS profile.merge_best. Target 2048. */
const SIZE=4;
const LABELS={2:'2G',4:'4G',8:'8G',16:'16',32:'32',64:'64',128:'128',256:'256',512:'512',1024:'1K',2048:'5G'};
const COLORS={2:'#33333d',4:'#3a3a48',8:'#00C2FF',16:'#0a9fd4',32:'#E6007E',64:'#b80064',128:'#F5A623',256:'#e69500',512:'#7C3AED',1024:'#5b27b0',2048:CONFIG.accentColor};
let board,score,bestTile,playing=false,won=false;
function ct(ev,p){console.log('CleverTap:',ev,p);}
function newBoard(){return Array.from({length:SIZE},()=>Array(SIZE).fill(0));}
function spawn(){const empty=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!board[r][c])empty.push([r,c]);
 if(!empty.length)return;const[r,c]=empty[Math.floor(Math.random()*empty.length)];board[r][c]=Math.random()<0.9?2:4;}
function render(){const g=document.getElementById('grid');g.innerHTML='';
 for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const v=board[r][c];const t=document.createElement('div');
  t.className='tile';t.dataset.v=v;t.textContent=v?(LABELS[v]||v):'';
  if(v){t.style.background=COLORS[v]||CONFIG.accentColor;if(v>=2048||v===2)t.style.color=v===2048?'#141414':'#fff';
   if(v===2048)t.style.color='#141414';}
  g.appendChild(t);}}
function slide(row){let arr=row.filter(v=>v);let merged=[];
 for(let i=0;i<arr.length;i++){if(arr[i]===arr[i+1]){const m=arr[i]*2;merged.push(m);score+=m;
  if(m>bestTile)bestTile=m;i++;}else merged.push(arr[i]);}
 while(merged.length<SIZE)merged.push(0);return merged;}
function rotate(b){const n=b.length;const r=newBoard();
 for(let i=0;i<n;i++)for(let j=0;j<n;j++)r[j][n-1-i]=b[i][j];return r;}
function move(dir){if(!playing||won)return;
 let b=board.map(r=>r.slice());let rot=dir; // 0 left,1 up,2 right,3 down
 for(let i=0;i<rot;i++)b=rotate(b);
 const before=JSON.stringify(b);
 b=b.map(slide);
 if(JSON.stringify(b)!==before){ // valid move
  for(let i=0;i<(4-rot)%4;i++)b=rotate(b);
  board=b;spawn();render();
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=LABELS[bestTile]||bestTile;
  ct('move',{dir:dir,score:score,best_tile:bestTile});
  if(bestTile>=2048&&!won){won=true;return winGame();}
  if(isStuck()){return gameOver();}}}
function isStuck(){for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
  if(!board[r][c])return false;
  if(c<SIZE-1&&board[r][c]===board[r][c+1])return false;
  if(r<SIZE-1&&board[r][c]===board[r+1][c])return false;}return true;}
function start(){board=newBoard();score=0;bestTile=2;won=false;playing=true;
 spawn();spawn();render();
 document.getElementById('score').textContent='0';document.getElementById('best').textContent='2G';
 status.textContent='Swipe to merge matching tiles!';document.getElementById('start').style.display='none';
 ct('game_started',{game:'data_merge'});}
function gameOver(){playing=false;
 status.innerHTML='Grid full! Best tile <b>'+(LABELS[bestTile]||bestTile)+'</b>, score <b>'+score+'</b>';
 const b=document.getElementById('start');b.style.display='block';b.textContent='PLAY AGAIN';b.disabled=false;b.onclick=start;
 ct('game_over',{merge_best:bestTile,score:score});}
function winGame(){playing=false;
 status.innerHTML='🎉 5G tile reached! Score <b>'+score+'</b>';
 const b=document.getElementById('start');b.style.display='block';b.textContent='CLAIM 5G BONUS 📶';b.disabled=false;
 ct('target_tile_reached',{merge_best:bestTile});
 b.onclick=()=>{ct('reward_won',{reward:'5g_bonus_data'});b.textContent='BONUS ADDED ✓';b.disabled=true;};}
document.getElementById('start').onclick=start;
board=newBoard();render();
window.addEventListener('keydown',e=>{const m={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3};
 if(m[e.key]!==undefined){e.preventDefault();move(m[e.key]);}});
// swipe
let sx,sy;const g=document.getElementById('grid');
g.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
g.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
 if(Math.abs(dx)>Math.abs(dy))move(dx>0?2:0);else move(dy>0?3:1);sx=sy=null;},{passive:true});
// mouse drag for desktop demo
let mx,my;g.addEventListener('mousedown',e=>{mx=e.clientX;my=e.clientY;});
g.addEventListener('mouseup',e=>{if(mx==null)return;const dx=e.clientX-mx,dy=e.clientY-my;
 if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
 if(Math.abs(dx)>Math.abs(dy))move(dx>0?2:0);else move(dy>0?3:1);mx=my=null;});
ct('Notification Viewed',{game:'data_merge',mechanic:'tile_merge_2048'});
</script></body></html>
