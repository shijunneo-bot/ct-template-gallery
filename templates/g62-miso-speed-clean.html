<!DOCTYPE html>
<!-- ============================================================
  G62 — MISO "SPEED CLEAN" · Whack-a-Mess Tap Game
  Surface: Custom HTML In-App · Grade A → B
  Behavioral: satisfying-cleanup loop (the brand promise AS the game)
  Lifecycle: engagement (KR/EN bilingual register)
  Mechanic: messes pop up in a 3x3 home grid, tap to clean before they fade.
  PROMOS: 20+ cleans → booking voucher. Brand: MISO coral (approx — verify)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#9b7f6f"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MISO · Speed Clean</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--coral:#FF7E67;--deep:#E2563E;--ink:#3A2A26;--cream:#FFF9F2;--soft:#FBE9DC}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Quicksand,sans-serif;min-height:100vh;background:linear-gradient(165deg,#f3ddcd,#caa183);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(60,35,25,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:88vw;max-width:358px;background:var(--cream);border-radius:22px;box-shadow:0 24px 60px rgba(70,35,20,.45);overflow:hidden}
.hd{padding:16px 20px 8px;position:relative;text-align:center}
.brand{font:700 12px Quicksand;letter-spacing:3px;color:var(--coral);margin-bottom:6px}
.x{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer}
h1{font-family:'Gowun Dodum',serif;font-size:21px;color:var(--ink)}
.hd p{font-size:11.5px;color:var(--cfg-accent,#9b7f6f);margin-top:4px;line-height:1.5}
.bar{display:flex;justify-content:space-between;padding:8px 24px 2px;font:700 11.5px Quicksand;color:#a8856f}
.bar b{color:var(--coral)}
.home{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 20px 4px}
.roomc{aspect-ratio:1;background:#fff;border:2px solid #f0ddcc;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;transition:.12s;position:relative}
.roomc:active{transform:scale(.93)}
.roomc .mess{animation:wob .5s infinite alternate}
@keyframes wob{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.roomc .sparkle{animation:spk .4s}
@keyframes spk{from{transform:scale(1.7);opacity:0}}
.body{padding:8px 20px 16px;text-align:center}
.result{display:none;margin-bottom:9px}
.result b{font-family:'Gowun Dodum',serif;font-size:17px;color:var(--coral);display:block}
.result span{font-size:12px;color:var(--cfg-accent,#9b7f6f)}
.btn{width:100%;border:0;border-radius:30px;padding:13px;background:var(--coral);color:#fff;font:700 14px Quicksand;cursor:pointer;box-shadow:0 5px 14px rgba(226,86,62,.3)}
.ctlog{margin-top:10px;font:700 10.5px ui-monospace,monospace;color:#ab8d79;background:#f7e8da;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">미소 · MISO</div>
    <h1>스피드 청소! Speed Clean 🧹</h1>
    <p>Messes pop up around the home — tap them away before they settle in! 25 seconds. (In real life, we do this part for you.)</p>
  </div>
  <div class="bar"><span>CLEANED <b id="sc">0</b></span><span>TIME <b id="tm">25</b>s</span></div>
  <div class="home" id="home"></div>
  <div class="body">
    <div class="result" id="result"><b id="rT"></b><span id="rS"></span></div>
    <button class="btn" id="go">START CLEANING · 시작!</button>
    
  </div>
</div></div>
<script>
/* 3x3 whack-a-mess. 20+ cleans → Promos first-booking voucher. */
const MESSES=['🧦','🍜','📚','🧸','☕','🍕','👕','🧴'];
let cells=[],score=0,time=25,running=false,timers=[];
function ct(ev,p){console.log('CleverTap:',ev,p);}
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='roomc';
 d.innerHTML='<span>✨</span>';
 d.onclick=()=>whack(i);home.appendChild(d);cells.push({el:d,mess:false,t:null});}
function popMess(){if(!running)return;
 const free=cells.map((c,i)=>c.mess?null:i).filter(x=>x!==null);
 if(!free.length)return;
 const i=free[Math.floor(Math.random()*free.length)];
 const c=cells[i];c.mess=true;
 c.el.innerHTML='<span class="mess">'+MESSES[Math.floor(Math.random()*MESSES.length)]+'</span>';
 c.t=setTimeout(()=>{if(c.mess){c.mess=false;c.el.innerHTML='<span>🫥</span>';
  setTimeout(()=>{if(!c.mess)c.el.innerHTML='<span>✨</span>';},400);}},1400);}
function whack(i){const c=cells[i];
 if(!running||!c.mess)return;
 c.mess=false;clearTimeout(c.t);
 score++;sc.textContent=score;
 c.el.innerHTML='<span class="sparkle">✨</span>';
 if(score%5===0)ct('mess_cleaned',{cleaned:score});}
go.onclick=()=>{if(running)return;
 running=true;score=0;time=25;sc.textContent=0;tm.textContent=25;
 result.style.display='none';go.textContent='청소 중… CLEANING!';
 ct('Game Played',{game:'speed_clean'});
 timers.push(setInterval(popMess,460));
 timers.push(setInterval(()=>{time--;tm.textContent=time;
  if(time<=0)end();},1000));};
function end(){running=false;timers.forEach(clearInterval);timers=[];
 cells.forEach(c=>{c.mess=false;clearTimeout(c.t);c.el.innerHTML='<span>✨</span>';});
 result.style.display='block';
 const win=score>=20;
 rT.textContent=win?score+' messes — 청소왕! Cleaning royalty 👑':score+' messes cleaned!';
 rS.textContent=win?'Imagine never doing this for real. First booking 20% off — go on, retire your inner whack-a-mess.':
  'Solid effort! 20 cleans unlocks the booking deal. (Or just… let MISO handle it. That\'s the whole idea.)';
 go.textContent=win?'CLAIM 20% FIRST BOOKING':'CLEAN AGAIN · 다시!';
 ct('game_over',{score:score,reward:win?'first20':'none'});
 if(win)go.onclick=()=>{ /* PROMOS: first-booking voucher */
  ct('reward_claimed',{reward:'first20'});
  go.textContent='저장됨 ✓ SAVED';go.disabled=true;};
 else go.onclick=()=>location.reload();}
ct('Notification Viewed',{game:'speed_clean',market:'kr'});
</script></body></html>
