<!DOCTYPE html>
<!-- ============================================================
  G58 — CAROUSELL "SPOT THE SUS" · Listing Judgement Quiz
  Surface: Custom HTML In-App · Grade A → B
  Behavioral: judgement mastery + trust education (safer buyers = healthier
  marketplace = Carousell's #1 trust metric, mirrors G44 civic register)
  Lifecycle: engagement + buyer-safety education
  SETS: {{profile.trust_savvy}} on perfect score → "Verified Savvy" badge.
  Brand: Carousell red (verified family)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#f3d5d2"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carousell · Spot the Sus</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Karla:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#FF2636;--deep:#C2121F;--ink:#1E0F11;--paper:#FFF8F7;--good:#2f9e6e;--bad:#e35d5d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Karla,sans-serif;min-height:100vh;background:linear-gradient(165deg,#4d1016,#1f070a);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(24,4,7,.64);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
.hd{background:linear-gradient(120deg,var(--red),#FF6A4D);color:#fff;padding:15px 18px;position:relative;text-align:center}
.brand{font:800 11px Karla;letter-spacing:3px;margin-bottom:4px;opacity:.95}
.x{position:absolute;top:11px;right:12px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.18);color:#fff;cursor:pointer}
h1{font-family:'Bowlby One';font-size:18px}
.hd p{font-size:11px;opacity:.93;margin-top:3px}
.scorebar{display:flex;justify-content:center;gap:7px;padding:11px 0 2px}
.sdot{width:30px;height:8px;border-radius:4px;background:var(--cfg-accent,#f3d5d2);transition:.3s}
.sdot.ok{background:var(--good)}.sdot.no{background:var(--bad)}
.listing{margin:8px 18px 0;background:#fff;border:2px solid var(--cfg-accent,#f3d5d2);border-radius:15px;padding:13px;min-height:128px}
.listing .lt{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.listing .lph{width:48px;height:48px;border-radius:10px;background:#fde9e7;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.listing .ln{font:800 13.5px Karla;color:var(--ink);line-height:1.3}
.listing .lp{font-family:'Bowlby One';font-size:15px;color:var(--red)}
.listing .ld{font-size:11.5px;color:#7d5a56;line-height:1.55;background:#fdf3f2;border-radius:9px;padding:8px 10px}
.verd{display:none;margin:8px 18px 0;border-radius:11px;padding:9px 12px;font-size:11.5px;line-height:1.5;font-weight:700}
.verd.ok{background:#e8f7ef;color:#1e6b48;display:block}
.verd.no{background:#fdebeb;color:#9c3535;display:block}
.tf{display:flex;gap:10px;padding:10px 18px 4px}
.tfb{flex:1;border:0;border-radius:13px;padding:13px;font:800 12.5px Karla;cursor:pointer;color:#fff;letter-spacing:.3px}
.tfb:active{transform:scale(.96)}
.tfb.legit{background:var(--good);box-shadow:0 4px 0 #1e6b48}
.tfb.sus{background:var(--bad);box-shadow:0 4px 0 #a33}
.body{padding:8px 18px 16px;text-align:center}
.result{display:none;margin-bottom:9px}
.result b{font-family:'Bowlby One';font-size:17px;color:var(--red);display:block}
.result span{font-size:12px;color:#9b7470;line-height:1.45}
.btn{width:100%;border:0;border-radius:12px;padding:13px;background:var(--red);color:#fff;font:800 13.5px Karla;cursor:pointer;box-shadow:0 5px 0 var(--deep);display:none}
.ctlog{margin-top:10px;font:700 10.5px ui-monospace,monospace;color:#b08884;background:#f8e7e5;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">CAROUSELL</div>
    <h1>SPOT THE SUS 🕵️</h1>
    <p>5 listings. Some legit, some sketchy. Trust your gut — then learn the tells.</p>
  </div>
  <div class="scorebar" id="sb"></div>
  <div class="listing">
    <div class="lt"><div class="lph" id="lPh">📱</div>
      <div><div class="ln" id="lN"></div><div class="lp" id="lP"></div></div></div>
    <div class="ld" id="lD"></div>
  </div>
  <div class="verd" id="vd"></div>
  <div class="tf" id="tf">
    <button class="tfb legit" onclick="judge(true)">LEGIT ✓</button>
    <button class="tfb sus" onclick="judge(false)">SUS 🚩</button>
  </div>
  <div class="body">
    <div class="result" id="result"><b id="rT"></b><span id="rS"></span></div>
    <button class="btn" id="claimBtn">CLAIM SAVVY BADGE 🛡️</button>
    
  </div>
</div></div>
<script>
/* Trust education as play. SETS profile.trust_savvy on 5/5. */
const QS=[
 {ph:'📱',n:'iPhone 15 Pro · "brand new"',p:'S$320',d:'"NO MEETUP. Pay first via friend\'s bank account, ship from overseas. No COD. Serious buyer only msg telegram."',legit:false,
  why:'SUS — 70% below market + off-platform payment + no meetup + telegram redirect. That\'s a bingo card of red flags.'},
 {ph:'🎸',n:'Yamaha Acoustic Guitar',p:'S$140',d:'"Used 2 years, small scratch on body (see pic 3). Meetup Bishan MRT or COD. Can test before paying!"',legit:true,
  why:'LEGIT — honest wear disclosed, photos referenced, public meetup, test-first. Textbook good seller.'},
 {ph:'👜',n:'"Authentic" Designer Bag',p:'S$95',d:'"100% real promise!! No receipt no box lost them. Cannot meetup, postage only, no returns final sale."',legit:false,
  why:'SUS — luxury at 95% off, zero proof, no inspection, no returns. "Promise" is not authentication.'},
 {ph:'🚲',n:'Foldable Bike · Tern link',p:'S$380',d:'"Selling cos moving house. Serviced last month (receipt avail). View/test at my void deck, Punggol. Price slightly nego."',legit:true,
  why:'LEGIT — real reason, service receipt, home-area viewing, reasonable price. Green flags everywhere.'},
 {ph:'🎮','n':'PS5 Bundle + 3 games',p:'S$200',d:'"URGENT today only!!! first to PAYNOW full amount gets it. Cannot view, item with my cousin. Many ppl asking, fast hand fast leg!"',legit:false,
  why:'SUS — artificial urgency + full payment blind + item "with cousin." Pressure is the product here.'}];
let i=0,score=0;
function ct(ev,p){console.log('CleverTap:',ev,p);}
QS.forEach(()=>{const d=document.createElement('div');d.className='sdot';sb.appendChild(d);});
function show(){const Q=QS[i];
 lPh.textContent=Q.ph;lN.textContent=Q.n;lP.textContent=Q.p;lD.textContent=Q.d;
 vd.className='verd';tf.style.pointerEvents='auto';}
function judge(v){tf.style.pointerEvents='none';
 const Q=QS[i],ok=v===Q.legit;if(ok)score++;
 sb.children[i].classList.add(ok?'ok':'no');
 vd.className='verd '+(ok?'ok':'no');vd.textContent=Q.why;
 ct('listing_judged',{q:i+1,correct:ok,score:score});
 setTimeout(()=>{i++;if(i<QS.length)show();else done();},2100);}
function done(){tf.style.display='none';result.style.display='block';
 if(score===5){rT.textContent='VERIFIED SAVVY 🛡️';
  rS.textContent='5/5 — scammers fear you. Badge earned; your buyer trust score just levelled up.';
  claimBtn.style.display='block';
  ct('quiz_perfect',{trust_savvy:true}); /* SETS profile.trust_savvy */
  claimBtn.onclick=()=>{ct('badge_claimed',{badge:'verified_savvy'});
   claimBtn.textContent='BADGE ON PROFILE ✓';claimBtn.disabled=true;};}
 else{rT.textContent=score+'/5 — getting sharper';
  rS.textContent='Remember the big three: too-cheap, can\'t-view, pay-first-pressure. Replay anytime.';
  ct('quiz_completed',{score:score});}}
show();
ct('Notification Viewed',{game:'spot_the_sus',register:'trust_education'});
</script></body></html>
