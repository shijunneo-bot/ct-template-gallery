<!DOCTYPE html>
<!-- ============================================================
  G73 — FUNNOW "SONGKRAN SPLASH DASH" · Tap-Dodge Arcade (TW/seasonal)
  Surface: Custom HTML In-App · Grade A → B
  Behavioral: playful reflex loop + festival joy → booking nudge
  Lifecycle: seasonal engagement · Songkran (April)
  Mechanic: tap to hop the avatar between 3 lanes, catch water (good),
  dodge nothing-bad — pure catch (white-festival-fun, no loss anxiety).
  PROMOS: score tier → spa/pool-party booking deal. Brand: FunNow coral (verify)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#7fb0c8"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FunNow · Songkran Splash Dash</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--coral:#FF5A36;--deep:#D63A18;--aqua:#36C5E5;--night:#10243a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Nunito,sans-serif;min-height:100vh;background:radial-gradient(circle at 50% -10%,#1a5a7a,#0a2233);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(6,20,32,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:88vw;max-width:358px;background:#0d2738;border-radius:22px;box-shadow:0 26px 64px rgba(0,0,0,.6);overflow:hidden;color:#fff;border:1px solid #1e4258}
.hd{padding:15px 20px 6px;text-align:center;position:relative}
.brand{font-family:Fredoka;font-size:16px;color:var(--coral);margin-bottom:4px}
.x{position:absolute;top:11px;right:12px;width:30px;height:30px;border:0;border-radius:50%;background:#ffffff14;color:#fff;cursor:pointer}
h1{font-family:Fredoka;font-size:19px}
.hd p{font-size:11px;color:#9fcde0;margin-top:3px}
.bar{display:flex;justify-content:space-between;padding:8px 24px 2px;font:800 11.5px Nunito;color:var(--cfg-accent,#7fb0c8)}
.bar b{color:var(--aqua)}
.stage{display:flex;justify-content:center;padding:6px 0 2px}
canvas{border-radius:14px;background:linear-gradient(180deg,#36C5E5,#1a7ba0);touch-action:none}
.hint{text-align:center;font:800 10px Nunito;letter-spacing:1.5px;color:var(--cfg-accent,#7fb0c8);padding:7px 0 0}
.body{padding:8px 20px 16px;text-align:center}
.result{display:none;margin-bottom:9px}
.result b{font-family:Fredoka;font-size:18px;color:var(--aqua);display:block}
.result span{font-size:11.5px;color:#9fcde0}
.btn{width:100%;border:0;border-radius:14px;padding:13px;background:var(--coral);color:#fff;font:800 14px Nunito;cursor:pointer;box-shadow:0 5px 0 var(--deep)}
.ctlog{margin-top:10px;font:700 10.5px ui-monospace,monospace;color:var(--cfg-accent,#7fb0c8);background:#0a1f2e;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">FunNow</div>
    <h1>Songkran Splash Dash 💦</h1>
    <p>สงกรานต์! Tap to hop lanes and catch the water. 20 seconds of joyful chaos.</p>
  </div>
  <div class="bar"><span>SPLASHES <b id="sc">0</b></span><span>TIME <b id="tm">20</b>s</span></div>
  <div class="stage"><canvas id="cv" width="300" height="260"></canvas></div>
  <div class="hint">TAP LEFT / RIGHT SIDE TO HOP LANES · CATCH 💧</div>
  <div class="body">
    <div class="result" id="result"><b id="rT"></b><span id="rS"></span></div>
    <button class="btn" id="go">START THE SPLASH</button>
    
  </div>
</div></div>
<script>
/* Pure catch (festival joy, no loss anxiety). Score tier → Promos booking deal. */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const LANES=[60,150,240];
let lane=1,drops=[],score=0,time=20,running=false,timers=[];
function ct(ev,p){console.log('CleverTap:',ev,p);}
cv.addEventListener('click',e=>{if(!running)return;
 const r=cv.getBoundingClientRect();
 if(e.clientX-r.left<150)lane=Math.max(0,lane-1);else lane=Math.min(2,lane+1);});
cv.addEventListener('touchstart',e=>{if(!running)return;
 const r=cv.getBoundingClientRect();
 if(e.touches[0].clientX-r.left<150)lane=Math.max(0,lane-1);else lane=Math.min(2,lane+1);
 e.preventDefault();},{passive:false});
function draw(){cx.clearRect(0,0,300,260);
 // lane hints
 cx.strokeStyle='rgba(255,255,255,.12)';cx.lineWidth=1;
 cx.beginPath();cx.moveTo(105,0);cx.lineTo(105,260);cx.moveTo(195,0);cx.lineTo(195,260);cx.stroke();
 cx.font='24px serif';
 drops.forEach(d=>cx.fillText(d.good?'💧':'🌸',d.x-12,d.y));
 // player bucket
 cx.font='34px serif';cx.fillText('🪣',LANES[lane]-17,244);}
function spawn(){if(!running)return;
 const l=Math.floor(Math.random()*3);
 drops.push({x:LANES[l],y:-8,v:2.3+Math.random()*1.7,good:Math.random()<.78,lane:l});}
function tick(){if(!running)return;
 drops.forEach(d=>d.y+=d.v);
 drops=drops.filter(d=>{
  if(d.y>208&&d.y<240&&d.lane===lane){
   score+=d.good?10:5; // flowers also nice — festival positivity
   return false;}
  return d.y<270;});
 draw();requestAnimationFrame(tick);}
go.onclick=()=>{if(running)return;
 running=true;score=0;time=20;drops=[];lane=1;sc.textContent=0;tm.textContent=20;
 result.style.display='none';go.textContent='SPLASHING…';
 ct('Game Played',{game:'songkran_splash_dash'});
 timers.push(setInterval(()=>{spawn();sc.textContent=score;},480));
 timers.push(setInterval(()=>{time--;tm.textContent=time;if(time<=0)end();},1000));
 tick();};
function end(){running=false;timers.forEach(clearInterval);timers=[];
 sc.textContent=score;result.style.display='block';
 const tier=score>=200?'pool party':score>=120?'spa day':null;
 rT.textContent=score+' SPLASHES! 💦';
 rS.textContent=tier?('Soaked and victorious — '+tier+' booking deal unlocked. สุขสันต์วันสงกรานต์!'):
  '120 splashes unlocks a spa-day deal. One more round — the water\'s warm!';
 go.textContent=tier?'BOOK MY '+tier.toUpperCase()+' →':'SPLASH AGAIN';
 ct('game_over',{score:score,reward:tier||'none'});
 if(tier)go.onclick=()=>{ct('reward_claimed',{reward:tier});
  go.textContent='BOOKING OPEN ✓';go.disabled=true;};
 else go.onclick=()=>location.reload();}
draw();
ct('Notification Viewed',{game:'songkran_splash_dash',season:'songkran',market:'tw'});
</script></body></html>
