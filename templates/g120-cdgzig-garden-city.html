<!DOCTYPE html>
<!-- ============================================================
  G120 — CDG ZIG "GROW YOUR GARDEN CITY" · Virtual-Tree Saga
  Tier-3 Concept #10 · Pattern P-E (Shopee Tanam — plant grows with each ride)
  Surface: Custom HTML In-App · Grade C ⚠️ (needs state persistence across
  sessions — key-value/SDK. Demo simulates persisted growth in one view.)
  Lifecycle: habit (greening-the-city narrative)
  SETS: {{profile.tree_stage}} + {{profile.rides_this_cycle}} → "your tree needs
  a ride" push. PROMOS: harvest reward. Cultural hook: Earth Day / monsoon green.
  Brand: CDG Zig navy/yellow + green (approx — verify)
  *** C-GRADE NOTE: persistent tree state requires user-property writes per ride
      + read-back on open. Scope SDK/key-value persistence with eng before pitch. ***
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#d4ecdc"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zig · Grow Your Garden City</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10265C;--grn:#36A85B;--deepg:#1F7A3D;--yel:#FFD23F;--ink:#0C2018;--paper:#F1FBF4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;min-height:100vh;background:linear-gradient(165deg,#0d2942,#08161f);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(4,12,18,.62);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:24px;box-shadow:0 26px 64px rgba(5,18,28,.5);overflow:hidden}
.hd{background:var(--navy);color:#fff;padding:16px 20px;position:relative;text-align:center}
.brand{font:700 12px 'Baloo 2';letter-spacing:2px;margin-bottom:4px}
.x{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.2);color:#fff;cursor:pointer}
h1{font-family:'Baloo 2';font-weight:700;font-size:19px}
.hd p{font-size:11.5px;opacity:.9;margin-top:3px;line-height:1.45}
.scene{position:relative;margin:14px 22px 4px;height:200px;background:linear-gradient(180deg,#d4f0e0 0%,#bfe8cd 70%,#a3d9b5 70%,#8fcfa3 100%);border-radius:18px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.sun{position:absolute;top:14px;right:18px;font-size:26px}
.tree{font-size:30px;transition:.6s;transform-origin:bottom center;margin-bottom:14px}
.skyline{position:absolute;bottom:0;left:0;right:0;font-size:18px;text-align:center;opacity:.55;letter-spacing:-2px}
.stagecap{margin:8px 22px 0;background:#fff;border:2px solid var(--cfg-accent,#d4ecdc);border-radius:13px;padding:12px 15px;text-align:center}
.stagecap b{font-family:'Baloo 2';font-size:15px;color:var(--deepg);display:block}
.stagecap span{font-size:11.5px;color:#6a8c78;line-height:1.5}
.meter{display:flex;align-items:center;gap:8px;padding:10px 22px 0}
.bar{flex:1;height:9px;background:var(--cfg-accent,#d4ecdc);border-radius:5px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--grn),var(--yel));border-radius:5px;transition:.5s}
.mcap{font:700 10px Inter;color:var(--deepg)}
.body{padding:12px 20px 18px;text-align:center}
.btn{width:100%;border:0;border-radius:13px;padding:14px;background:var(--grn);color:#fff;font:700 14px 'Baloo 2';cursor:pointer;box-shadow:0 5px 0 var(--deepg)}
.btn:disabled{opacity:.55;box-shadow:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--deepg)}
.sim{font-size:9.5px;color:#8aab98;margin-top:8px}
.ctlog{margin-top:9px;font:700 10.5px ui-monospace,monospace;color:#7a9c88;background:#e3f3ea;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">ZIG · CDG</div>
    <h1>Grow Your Garden City 🌳</h1>
    <p>Every ride waters your tree. Grow it to full bloom and we'll plant a real one.</p>
  </div>
  <div class="scene">
    <div class="sun">☀️</div>
    <div class="tree" id="tree" style="font-size:26px">🌱</div>
    <div class="skyline">🏢🏬🏢🏙️🏢🏬🏢</div>
  </div>
  <div class="stagecap" id="stagecap"><b>A tiny sprout</b><span>Your garden city begins. Take a ride to help it grow.</span></div>
  <div class="meter"><div class="bar"><div class="fill" id="fill"></div></div><div class="mcap" id="mcap">0/6</div></div>
  <div class="body">
    <button class="btn" id="go">🚕 TAKE A RIDE — WATER MY TREE</button>
    <div class="sim">Demo: each tap simulates one ride watering the tree.</div>
    
  </div>
</div></div>
<script>
/* P-E virtual-tree saga. SETS profile.tree_stage + rides_this_cycle.
   C-GRADE: real version persists tree_stage as a user property, written per ride
   and read on app open. Demo simulates the persisted growth locally. */
const STAGES=[
 {ic:'🌱',sz:26,b:'A tiny sprout',s:'Your garden city begins. Take a ride to help it grow.'},
 {ic:'🌿',sz:34,b:'First leaves',s:'Green shoots! The city\'s a little greener already.'},
 {ic:'☘️',sz:42,b:'Growing strong',s:'Roots taking hold. Keep those rides coming.'},
 {ic:'🌳',sz:52,b:'A young tree',s:'Shade for the street. You\'re over halfway there.'},
 {ic:'🌲',sz:62,b:'Full canopy',s:'Almost there — one more ride to full bloom.'},
 {ic:'🌸',sz:70,b:'In full bloom!',s:'Your tree is thriving — and we\'ll plant a real one in your name. 🎉'}];
let rides=0;
function ct(ev,p){console.log('CleverTap:',ev,p);}
go.onclick=()=>{if(rides>=5){return;}
 rides++;
 const S=STAGES[rides];
 tree.textContent=S.ic;tree.style.fontSize=S.sz+'px';
 stagecap.innerHTML='<b>'+S.b+'</b><span>'+S.s+'</span>';
 fill.style.width=Math.round(rides/5*100)+'%';mcap.textContent=rides+'/5';
 /* SETS profile.tree_stage + rides_this_cycle */
 ct('tree_watered',{tree_stage:rides,rides_this_cycle:rides});
 if(rides>=5){go.textContent='🌸 HARVEST — PLANT A REAL TREE';
  /* PROMOS: harvest reward + real-tree CSR tie-in */
  ct('tree_bloomed',{tree_stage:'bloom',complete:true});
  go.onclick=()=>{ct('reward_won',{reward:'real_tree_planted + ride_credit'});
   go.textContent='TREE PLANTED 🌳 THANK YOU';go.disabled=true;};}};
ct('Notification Viewed',{saga:'garden_city',hook:'earth_day',grade:'C'});
</script></body></html>
