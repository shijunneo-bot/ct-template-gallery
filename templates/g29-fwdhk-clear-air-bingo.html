<!DOCTYPE html>
<!-- ============================================================
  G29 — FWD HK "CLEAR AIR BINGO" · White-Hat Wellness Bingo (AQI-Aware)
  Surface: CleverTap Custom HTML In-App · Grade B (context via key-value)
  ⚪ WHITE HAT (STRICT): completion-based, zero chance — every square is an
  action the user chooses to do. No prizes by luck; reward = completing a line.
  CONTEXT: AQI band arrives via campaign KEY-VALUE PAIRS (Linked Content powers
  the *push* that triggers this; in-app itself reads key-values, per addendum).
  Debug toggles simulate HAZE / CLEAR / API-FAIL states incl. fallback copy.
  Lifecycle: engagement + wellbeing brand register (Celebrate Living)
  SETS: {{profile.bingo_lines}} → wellbeing content journey (no sales push).
  Brand: FWD orange #E87722 (verified family) · HK market
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#e87722"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FWD · Clear Air Bingo</title>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Mulish:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--org:var(--cfg-accent,#e87722);--deep:#B55712;--ink:#2B1B10;--paper:#FFFBF6;--soft:#FBEBDD}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Mulish,'Segoe UI',sans-serif;min-height:100vh;background:linear-gradient(165deg,#5d4a3a,#2b2018);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(25,16,9,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden}
.ctx{background:#6B7A8C;color:#fff;padding:9px 16px;font:800 10.5px Mulish;letter-spacing:1px;display:flex;align-items:center;gap:8px;transition:.3s}
.ctx.haze{background:#8C7A5B}
.ctx.fail{background:#7d8a96}
.hd{padding:16px 20px 8px;position:relative;text-align:center}
.brand{font:800 12px Mulish;letter-spacing:3px;color:var(--org);margin-bottom:7px}
.x{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer}
h1{font-family:Bitter,Georgia;font-size:20px;color:var(--ink)}
.hd p{font-size:12px;color:#8d6f59;margin-top:4px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 18px 4px}
.sq{aspect-ratio:1;background:#fff;border:2px solid #efdcc9;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:.18s;padding:4px;text-align:center}
.sq:active{transform:scale(.94)}
.sq i{font-style:normal;font-size:21px}
.sq span{font:800 8.5px Mulish;color:#7a604c;line-height:1.2;letter-spacing:.2px}
.sq.done{background:var(--org);border-color:var(--org)}
.sq.done span{color:#fff}
.sq.done i{transform:scale(1.1)}
.linestat{text-align:center;font:800 11px Mulish;color:#a98a6f;letter-spacing:1px;padding:8px 0 2px}
.body{padding:8px 18px 18px;text-align:center}
.result{display:none;margin-bottom:9px}
.result b{font-family:Bitter;font-size:17px;color:var(--org);display:block}
.result span{font-size:12px;color:#8d6f59}
.btn{width:100%;border:0;border-radius:12px;padding:13px;background:var(--org);color:#fff;font:800 13.5px Mulish;cursor:pointer;box-shadow:0 5px 0 var(--deep);display:none}
.debug{display:flex;gap:6px;justify-content:center;padding:0 0 10px}
.dbg{border:1.5px dashed #c9b39d;background:transparent;border-radius:8px;padding:5px 10px;font:800 9.5px Mulish;color:#a98a6f;cursor:pointer;letter-spacing:.5px}
.dbg.on{background:#efe2d2;color:var(--deep);border-style:solid}
.ctlog{margin:0 18px 14px;font:700 10.5px ui-monospace,monospace;color:#a98e74;background:#f6ead9;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="ctx" id="ctx">🌫️ <span id="ctxT">AQI 156 · UNHEALTHY — INDOOR DAY, HONG KONG</span></div>
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">FWD · CELEBRATE LIVING</div>
    <h1 id="h1">Hazy outside. Thrive inside. 🍵</h1>
    <p id="sub">Nine small indoor wins. Complete any line — your pace, your choice, no luck involved.</p>
  </div>
  <div class="grid" id="grid"></div>
  <div class="linestat" id="ls">0 LINES · TAP A SQUARE YOU'VE DONE TODAY</div>
  <div class="body">
    <div class="result" id="result"><b id="rT"></b><span id="rS"></span></div>
    <button class="btn" id="claimBtn">UNLOCK MY WELLBEING GUIDE 🌿</button>
  </div>
  <div class="debug">
    <button class="dbg on" onclick="setCtx('haze',this)">DEBUG: HAZE</button>
    <button class="dbg" onclick="setCtx('clear',this)">CLEAR</button>
    <button class="dbg" onclick="setCtx('fail',this)">API FAIL</button>
  </div>
  
</div></div>
<script>
/* WHITE HAT: completion-based only. CONTEXT via key-value pairs {aqi_band}.
   API-FAIL state shows Liquid-fallback copy (5s timeout, no retry → defaults).
   SETS profile.bingo_lines. */
const SQUARES=[['💧','2L OF WATER'],['🧘','5-MIN STRETCH'],['📖','READ 10 PAGES'],['🍊','EAT A FRUIT'],['🌬️','BREATHING BREAK'],['📵','1HR SCREEN-FREE'],['🍵','WARM TEA'],['🪟','CHECK AIR FILTER'],['😴','SLEEP BY 11']];
const CTX={
 haze:{bar:'🌫️ AQI 156 · UNHEALTHY — INDOOR DAY, HONG KONG',cls:'haze',h:'Hazy outside. Thrive inside. 🍵',s:'Nine small indoor wins. Complete any line — your pace, your choice, no luck involved.'},
 clear:{bar:'🌤️ AQI 42 · GOOD — BEAUTIFUL DAY, HONG KONG',cls:'',h:'Clear skies! Bingo goes outdoors 🌳',s:'Same board, fresh-air edition — swap any square for its outdoor twin today.'},
 fail:{bar:'🌿 WELLNESS BINGO — TODAY\'S EDITION',cls:'fail',h:'Nine small wins for today 🌿',s:'(Fallback copy — air-quality feed unavailable; generic wellbeing board shown.)'}};
let done=new Set(),lines=0;
function ct(ev,p){console.log('CleverTap:',ev,p);}
function setCtx(k,btn){document.querySelectorAll('.dbg').forEach(b=>b.classList.remove('on'));
 btn.classList.add('on');const C=CTX[k];
 ctx.className='ctx '+C.cls;ctxT.textContent=C.bar;
 h1.textContent=C.h;sub.textContent=C.s;
 ct('context_state',{aqi_band:k,source:k==='fail'?'liquid_fallback':'key_value'});}
SQUARES.forEach((S,i)=>{const d=document.createElement('div');d.className='sq';
 d.innerHTML=`<i>${S[0]}</i><span>${S[1]}</span>`;
 d.onclick=()=>{d.classList.toggle('done');
  d.classList.contains('done')?done.add(i):done.delete(i);
  ct('bingo_square',{square:S[1],total:done.size});check();};
 grid.appendChild(d);});
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function check(){const n=LINES.filter(L=>L.every(i=>done.has(i))).length;
 if(n!==lines){lines=n;
  ls.textContent=lines+' LINE'+(lines===1?'':'S')+(lines?' — LOVELY':' · TAP A SQUARE YOU\'VE DONE TODAY');
  if(lines>=1){result.style.display='block';
   rT.textContent='Line complete 🎉';
   rS.textContent='That\'s a genuinely good day. Your curated wellbeing guide is ready.';
   claimBtn.style.display='block';
   ct('bingo_line_completed',{bingo_lines:lines}); /* SETS profile.bingo_lines */
   claimBtn.onclick=()=>{ /* white-hat reward: CONTENT, not discount */
    ct('wellbeing_guide_opened',{});claimBtn.textContent='GUIDE OPENED ✓';claimBtn.disabled=true;};}}}
ct('Notification Viewed',{game:'clear_air_bingo',register:'white_hat',trigger:'aqi_push'});
</script></body></html>
