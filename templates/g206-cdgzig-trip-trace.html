<!DOCTYPE html>
<!-- ============================================================
  G206 — CDG ZIG "TRIP TRACE" · Zip-Style One-Line Number Path
  Mechanic: Hamiltonian-path LOGIC (LinkedIn-Zip-spirit, public-domain genre) —
  draw one continuous line that passes through numbered cells in order (1,2,3...) and
  fills EVERY cell exactly once. A valid Hamiltonian path through the waypoints is
  VERIFIED to exist (boustrophedon path covering all 25 cells, waypoints on it). NO
  trademarked art/names. Brand-skinned as tracing a ride route through every stop.
  NEW FAMILY (number-path Hamiltonian). Daily-puzzle format. Surface: in-app Custom
  HTML. Grade B. Lifecycle: engagement (daily-return). SETS: {{profile.zip_solved}}.
  PROMOS: ride credit on solve. Brand: CDG Zig blue/teal (approx — verify)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#1b9cd8"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDG Zig · Trip Trace</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:var(--cfg-accent,#1b9cd8);--deep:#147099;--teal:#0FBFB0;--gold:#F5A623;--grn:#2FA85B;--ink:#08222E;--paper:#F0FAFD;--soft:#D2EEF6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;min-height:100vh;background:linear-gradient(165deg,#0a2733,#06141b);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(4,14,20,.62);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:24px;box-shadow:0 26px 64px rgba(4,18,26,.5);overflow:hidden}
.hd{padding:14px 20px 8px;position:relative;text-align:center}
.brand{font:800 11px Sora;letter-spacing:2px;color:#6aaec8;margin-bottom:4px}
.x{position:absolute;top:11px;right:14px;width:30px;height:30px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer}
h1{font-family:Sora;font-weight:800;font-size:18px;color:var(--ink)}
.hd p{font-size:10.5px;color:#5a8194;margin-top:2px;line-height:1.4}
.stage{display:flex;justify-content:center;padding:8px 0 2px}
#cv{background:#fff;border:2px solid var(--soft);border-radius:12px;touch-action:none;cursor:pointer}
.body{padding:6px 20px 16px;text-align:center}
.status{font:700 10.5px Inter;color:#5a8194;min-height:15px;margin-bottom:8px}
.status b{color:var(--deep)}
.btn{width:100%;border:0;border-radius:13px;padding:13px;background:var(--blue);color:#fff;font:800 14px Sora;cursor:pointer;box-shadow:0 5px 0 var(--deep)}
.btn:disabled{opacity:.55;box-shadow:none}
.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--soft);box-shadow:none;margin-top:7px;font-size:12px;padding:9px}
.hint{font-size:9px;color:#8ab8c8;margin-top:5px}
.ctlog{margin-top:9px;font:700 10px ui-monospace,monospace;color:#6aaec8;background:#e3f4f9;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">CDG ZIG</div>
    <h1>Trip Trace 🚕</h1>
    <p>Draw one continuous route that visits stops 1→5 in order — and passes through every single cell exactly once!</p>
  </div>
  <div class="stage"><canvas id="cv" width="250" height="250"></canvas></div>
  <div class="body">
    <div class="status" id="status">Tap Start, then drag from stop 1.</div>
    <button class="btn" id="start">START</button>
    <button class="btn ghost" id="clear" style="display:none">↩ Clear route</button>
    <div class="hint">Drag across adjacent cells · hit 1,2,3,4,5 in order · fill all 25</div>
    
  </div>
</div></div>
<script>
/* Zip / Hamiltonian-path LOGIC (public-domain). 5x5, visit waypoints 1..5 in order,
   fill every cell once. A valid solution path is verified to exist. IP-neutral.
   SETS profile.zip_solved. */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const N=5,CELL=50;
// waypoint numbers placed on verified boustrophedon path positions
const WAYPOINTS={'0,0':1,'1,3':2,'2,2':3,'3,1':4,'4,4':5};
let path,drawing,playing=false,won=false;
function ct(ev,p){console.log('CleverTap:',ev,p);}
function reset(){path=[];drawing=false;won=false;draw();}
function cellAt(px,py){const rect=cv.getBoundingClientRect();
 const x=(px-rect.left)*(cv.width/rect.width),y=(py-rect.top)*(cv.height/rect.height);
 const c=Math.floor(x/CELL),r=Math.floor(y/CELL);if(r<0||r>=N||c<0||c>=N)return null;return {r,c};}
function adjacent(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;}
function down(e){if(!playing||won)return;const cell=cellAt(e.clientX,e.clientY);if(!cell)return;
 // must start at waypoint 1
 if(path.length===0&&WAYPOINTS[cell.r+','+cell.c]!==1){status.textContent='Start at stop 1!';return;}
 drawing=true;path=[cell];draw();}
function move(e){if(!playing||!drawing)return;const cell=cellAt(e.clientX,e.clientY);if(!cell)return;
 const last=path[path.length-1];
 // backtrack
 if(path.length>=2&&path[path.length-2].r===cell.r&&path[path.length-2].c===cell.c){path.pop();draw();return;}
 if(path.some(p=>p.r===cell.r&&p.c===cell.c))return;
 if(!adjacent(last,cell))return;
 // enforce waypoint ordering: can't enter a numbered cell out of sequence
 const num=WAYPOINTS[cell.r+','+cell.c];
 if(num){const visitedNums=path.map(p=>WAYPOINTS[p.r+','+p.c]).filter(Boolean);
  const expected=visitedNums.length+1;if(num!==expected){return;}}
 path.push(cell);draw();}
function up(){if(!playing||!drawing)return;drawing=false;check();}
function check(){const filled=path.length;
 // win: all 25 filled, waypoints hit in order
 const nums=path.map(p=>WAYPOINTS[p.r+','+p.c]).filter(Boolean);
 const ordered=nums.join('')==='12345';
 if(filled===N*N&&ordered&&!won){won=true;return win();}
 if(filled===N*N&&!ordered)status.textContent='All cells filled, but stops are out of order.';
 else status.innerHTML='<b>'+filled+'</b>/25 cells · stops hit: '+nums.join('→');}
function draw(){cx.clearRect(0,0,cv.width,cv.height);
 // grid
 cx.strokeStyle='#d2eef6';for(let i=0;i<=N;i++){cx.beginPath();cx.moveTo(i*CELL,0);cx.lineTo(i*CELL,N*CELL);cx.stroke();
  cx.beginPath();cx.moveTo(0,i*CELL);cx.lineTo(N*CELL,i*CELL);cx.stroke();}
 // path
 if(path.length){cx.strokeStyle=CONFIG.accentColor;cx.lineWidth=16;cx.lineCap='round';cx.lineJoin='round';
  cx.beginPath();path.forEach((p,i)=>{const x=p.c*CELL+CELL/2,y=p.r*CELL+CELL/2;
   if(i===0)cx.moveTo(x,y);else cx.lineTo(x,y);});cx.stroke();cx.lineWidth=1;}
 // waypoints
 Object.entries(WAYPOINTS).forEach(([k,n])=>{const [r,c]=k.split(',').map(Number);
  const x=c*CELL+CELL/2,y=r*CELL+CELL/2;
  cx.beginPath();cx.arc(x,y,15,0,7);cx.fillStyle='#147099';cx.fill();
  cx.fillStyle='#fff';cx.font='800 16px Sora';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(n,x,y);});}
function start(){reset();playing=true;status.textContent='Drag from stop 1 through every cell.';
 document.getElementById('start').style.display='none';document.getElementById('clear').style.display='block';
 ct('game_started',{game:'trip_trace'});}
function win(){playing=false;draw();
 status.innerHTML='🎉 Every stop, every cell — perfect route!';
 const b=document.getElementById('start');b.style.display='block';b.textContent='CLAIM RIDE CREDIT 🎁';b.disabled=false;
 document.getElementById('clear').style.display='none';
 ct('puzzle_solved',{zip_solved:true});
 b.onclick=()=>{ct('reward_won',{reward:'ride_credit'});b.textContent='CREDIT BANKED ✓';b.disabled=true;};}
document.getElementById('clear').onclick=()=>{if(playing){reset();document.getElementById('clear').style.display='block';
 status.textContent='Route cleared — drag from stop 1.';}};
cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
document.getElementById('start').onclick=start;
reset();
ct('Notification Viewed',{game:'trip_trace',mechanic:'zip_hamiltonian_path'});
</script></body></html>
