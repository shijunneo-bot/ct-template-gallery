<!DOCTYPE html>
<!-- ============================================================
  G89 — FAVE "HAWKER DASH" · Order-Matching Speed Game
  Surface: Custom HTML In-App · Grade A → B
  Behavioral: match-under-pressure loop + local-food brand glue
  Lifecycle: engagement → F&B deal discovery
  Mechanic: customer orders a dish; tap the matching stall fast. 25s.
  PROMOS: 15+ served → F&B cashback boost. Brand: Fave teal (verify)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#7da39e"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fave · Hawker Dash</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#00B5AD;--deep:#00837D;--ink:#0E2A28;--paper:#F5FCFB}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Nunito,sans-serif;min-height:100vh;background:linear-gradient(165deg,#0d4a46,#062523);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(4,22,20,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden}
.hd{background:linear-gradient(120deg,var(--teal),#3ed3c5);color:#fff;padding:15px 18px;position:relative;text-align:center}
.brand{font-family:Fredoka;font-size:15px;margin-bottom:4px}
.x{position:absolute;top:11px;right:12px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.16);color:#fff;cursor:pointer}
h1{font-family:Fredoka;font-size:19px}
.hd p{font-size:11px;opacity:.95;margin-top:3px}
.bar{display:flex;justify-content:space-between;padding:8px 24px 2px;font:800 11.5px Nunito;color:var(--cfg-accent,#7da39e)}
.bar b{color:var(--teal)}
.order{margin:8px 22px 0;background:#fff;border:2px solid #d9efec;border-radius:14px;padding:14px;text-align:center}
.order .ol{font:800 9.5px Nunito;letter-spacing:1.5px;color:#9bc3bd}
.order .od{font-family:Fredoka;font-size:19px;color:var(--ink);margin-top:4px}
.order .oe{font-size:36px;margin-top:4px}
.stalls{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px 22px 4px}
.stall{border:2px solid #d9efec;background:#fff;border-radius:13px;padding:13px 8px;cursor:pointer;text-align:center;transition:.12s}
.stall:active{transform:scale(.94)}
.stall i{font-style:normal;font-size:26px;display:block}
.stall span{font:800 10.5px Nunito;color:var(--ink);display:block;margin-top:3px}
.stall.ok{border-color:#2f9e6e;background:#eaf7f0}
.stall.no{border-color:#e35d5d;background:#fdeeee}
.body{padding:8px 20px 16px;text-align:center}
.result{display:none;margin-bottom:9px}
.result b{font-family:Fredoka;font-size:18px;color:var(--teal);display:block}
.result span{font-size:12px;color:#5e837e}
.btn{width:100%;border:0;border-radius:14px;padding:13px;background:var(--teal);color:#fff;font:800 14px Nunito;cursor:pointer;box-shadow:0 5px 0 var(--deep)}
.ctlog{margin-top:10px;font:700 10.5px ui-monospace,monospace;color:var(--cfg-accent,#7da39e);background:#e4f2f0;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">Fave</div>
    <h1>Hawker Dash 🍜</h1>
    <p>Customers are hungry! Tap the stall that matches each order, fast. 25 seconds.</p>
  </div>
  <div class="bar"><span>SERVED <b id="sv">0</b></span><span>TIME <b id="tm">25</b>s</span></div>
  <div class="order"><div class="ol">NOW SERVING</div><div class="od" id="od">Chicken Rice</div><div class="oe" id="oe">🍗</div></div>
  <div class="stalls" id="stalls"></div>
  <div class="body">
    <div class="result" id="result"><b id="rT"></b><span id="rS"></span></div>
    <button class="btn" id="go">OPEN THE STALL</button>
    
  </div>
</div></div>
<script>
/* Match order→stall fast. 15+ → Promos F&B cashback boost. */
const DISHES=[['Chicken Rice','🍗'],['Laksa','🍲'],['Char Kway Teow','🍳'],['Roti Prata','🫓'],['Satay','🍢'],['Bak Kut Teh','🥣']];
let cur=null,served=0,time=25,running=false,timers=[];
function ct(ev,p){console.log('CleverTap:',ev,p);}
function renderStalls(){
 // pick 4 stalls incl. the correct one
 const correct=cur;const others=DISHES.filter(d=>d[0]!==correct[0]).sort(()=>Math.random()-.5).slice(0,3);
 const opts=[correct,...others].sort(()=>Math.random()-.5);
 stalls.innerHTML='';opts.forEach(d=>{const b=document.createElement('div');b.className='stall';
  b.innerHTML=`<i>${d[1]}</i><span>${d[0]}</span>`;
  b.onclick=()=>serve(d,b);stalls.appendChild(b);});}
function nextOrder(){cur=DISHES[Math.floor(Math.random()*DISHES.length)];
 od.textContent=cur[0];oe.textContent=cur[1];renderStalls();}
function serve(d,btn){if(!running)return;
 const ok=d[0]===cur[0];
 if(ok)served++;sv.textContent=served;
 btn.classList.add(ok?'ok':'no');
 setTimeout(()=>btn.classList.remove('ok','no'),180);
 ct('order_served',{correct:ok,served:served});
 nextOrder();}
go.onclick=()=>{if(running)return;
 running=true;served=0;time=25;sv.textContent=0;tm.textContent=25;
 result.style.display='none';go.textContent='SERVING…';
 ct('Game Played',{game:'hawker_dash'});nextOrder();
 timers.push(setInterval(()=>{time--;tm.textContent=time;if(time<=0)end();},1000));};
function end(){running=false;timers.forEach(clearInterval);timers=[];
 od.textContent='STALL CLOSED';oe.textContent='🌙';
 result.style.display='block';
 const win=served>=15;
 rT.textContent=served+' CUSTOMERS SERVED!';
 rS.textContent=win?'Hawker hero! 15+ served earns an F&B cashback boost. Now go eat the real thing. 🍜':
  'Lunch rush is brutal! Serve 15 for the cashback boost — one more round?';
 go.textContent=win?'CLAIM F&B CASHBACK BOOST →':'OPEN AGAIN';
 ct('game_over',{served:served,reward:win?'fnb_cashback':'none'});
 if(win)go.onclick=()=>{ct('reward_claimed',{reward:'fnb_cashback'});
  go.textContent='BOOST ACTIVE ✓';go.disabled=true;};
 else go.onclick=()=>location.reload();}
ct('Notification Viewed',{game:'hawker_dash',trigger:'fnb_discovery'});
</script></body></html>
