<!DOCTYPE html>
<!-- ============================================================
  G80 — YES 5G "GREEN CHARGE" · Earth Day Tap-Charge Game
  Surface: Custom HTML In-App · Grade A → B
  Behavioral: rapid-tap charge meter + eco brand-purpose tie-in
  Lifecycle: seasonal engagement · Earth Day (April 22)
  Mechanic: tap to charge a battery from renewable sources before time runs;
  brand pledges a real tree per X completions (CSR honest framing).
  PROMOS: full charge → green data bonus. Brand: Yes 5G pink/magenta (verify)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#9fd9b8"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yes 5G · Green Charge</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#FF1F7D;--deep:#C40057;--green:#2DD46E;--ink:#1F0A16}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Manrope,sans-serif;min-height:100vh;background:radial-gradient(circle at 50% -10%,#1c4d33,#0a1c12);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(6,18,11,.64);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:88vw;max-width:358px;background:#10241a;border-radius:22px;box-shadow:0 26px 64px rgba(0,0,0,.6);overflow:hidden;color:#fff;border:1px solid #1f4a33}
.hd{padding:15px 20px 6px;text-align:center;position:relative}
.brand{font-family:Bungee;font-size:14px;color:var(--green);margin-bottom:4px}
.x{position:absolute;top:11px;right:12px;width:30px;height:30px;border:0;border-radius:50%;background:#ffffff14;color:#fff;cursor:pointer}
h1{font-family:Bungee;font-size:18px}
.hd p{font-size:11px;color:var(--cfg-accent,#9fd9b8);margin-top:4px;line-height:1.5}
.bar{display:flex;justify-content:space-between;padding:8px 24px 2px;font:800 11.5px Manrope;color:#7fc8a0}
.bar b{color:var(--green)}
.battwrap{display:flex;justify-content:center;align-items:center;padding:10px 0 4px;gap:14px}
.batt{width:78px;height:140px;border:4px solid #2f7a52;border-radius:12px;position:relative;background:#0c1c14;overflow:hidden}
.batt::before{content:'';position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:30px;height:8px;background:#2f7a52;border-radius:4px 4px 0 0}
.fill{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(180deg,#5DEB8E,var(--green));transition:height .15s}
.pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Bungee;font-size:20px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.srcs{display:flex;flex-direction:column;gap:10px}
.src{font-size:30px;opacity:.5;transition:.2s}
.src.live{opacity:1;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.tapbtn{width:calc(100% - 40px);margin:8px 20px 0;border:0;border-radius:16px;padding:20px;background:linear-gradient(90deg,var(--green),#1ba85a);color:#062314;font:800 17px Bungee;cursor:pointer;box-shadow:0 6px 0 #14794a;user-select:none}
.tapbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #14794a}
.tapbtn:disabled{opacity:.5;box-shadow:none}
.body{padding:10px 20px 16px;text-align:center}
.result{display:none;margin-bottom:9px}
.result b{font-family:Bungee;font-size:16px;color:var(--green);display:block}
.result span{font-size:11.5px;color:var(--cfg-accent,#9fd9b8);line-height:1.5}
.btn{width:100%;border:0;border-radius:14px;padding:13px;background:var(--pink);color:#fff;font:800 14px Manrope;cursor:pointer;box-shadow:0 5px 0 var(--deep);display:none}
.ctlog{margin-top:10px;font:700 10.5px ui-monospace,monospace;color:#7fc8a0;background:#0c1c14;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">YES 5G · EARTH DAY</div>
    <h1>GREEN CHARGE 🌱</h1>
    <p>Tap to charge the battery from clean energy before time runs out. Every full charge = Yes plants a real tree.</p>
  </div>
  <div class="bar"><span>CHARGE <b id="pc">0</b>%</span><span>TIME <b id="tm">15</b>s</span></div>
  <div class="battwrap">
    <div class="srcs"><span class="src" id="s0">☀️</span><span class="src" id="s1">💨</span><span class="src" id="s2">💧</span></div>
    <div class="batt"><div class="fill" id="fill"></div><div class="pct" id="pctTxt">0%</div></div>
    <div class="srcs"><span class="src">🌳</span><span class="src">🌍</span><span class="src">♻️</span></div>
  </div>
  <button class="tapbtn" id="tap" disabled>TAP FAST TO CHARGE ⚡</button>
  <div class="body">
    <div class="result" id="result"><b id="rT"></b><span id="rS"></span></div>
    <button class="btn" id="claimBtn">CLAIM GREEN DATA BONUS 🌱</button>
    
  </div>
</div></div>
<script>
/* Rapid-tap charge. Full → Promos green data bonus + real-tree CSR pledge. */
let charge=0,time=15,running=false,timers=[];
function ct(ev,p){console.log('CleverTap:',ev,p);}
function rotateSrc(){[0,1,2].forEach(i=>document.getElementById('s'+i).classList.remove('live'));
 document.getElementById('s'+Math.floor(Math.random()*3)).classList.add('live');}
tap.onclick=()=>{if(!running)return;
 charge=Math.min(100,charge+3.2);
 fill.style.height=charge+'%';
 const v=Math.round(charge);pc.textContent=v;pctTxt.textContent=v+'%';
 if(charge>=100)complete();};
const go=document.createElement('button');
function start(){running=true;charge=0;time=15;
 fill.style.height='0%';pc.textContent=0;pctTxt.textContent='0%';
 tap.disabled=false;tap.textContent='TAP FAST TO CHARGE ⚡';
 result.style.display='none';
 ct('Game Played',{game:'green_charge'});
 timers.push(setInterval(rotateSrc,700));
 timers.push(setInterval(()=>{time--;tm.textContent=time;if(time<=0)end();},1000));}
function complete(){if(!running)return;end(true);}
function end(full){running=false;timers.forEach(clearInterval);timers=[];
 tap.disabled=true;
 result.style.display='block';
 const won=full||charge>=100;
 rT.textContent=won?'FULLY CHARGED! 🌳':Math.round(charge)+'% — NICE EFFORT';
 rS.textContent=won?'100% clean energy — Yes will plant a real tree on your behalf. Green data bonus unlocked too.':
  'Reach 100% to trigger a real tree + green data bonus. The planet roots for a rematch!';
 claimBtn.style.display=won?'block':'none';
 ct('game_over',{charge:Math.round(charge),tree_pledged:won});
 if(won)claimBtn.onclick=()=>{ /* PROMOS: green data bonus + CSR tree */
  ct('reward_claimed',{reward:'green_data_bonus',tree:true});
  claimBtn.textContent='CREDITED ✓ TREE PLEDGED';claimBtn.disabled=true;};}
// kick off on first interaction via the tap button enabling
setTimeout(()=>{tap.disabled=false;tap.textContent='TAP TO START CHARGING ⚡';
 tap.onclick=()=>{tap.onclick=()=>{if(!running)return;
   charge=Math.min(100,charge+3.2);fill.style.height=charge+'%';
   const v=Math.round(charge);pc.textContent=v;pctTxt.textContent=v+'%';
   if(charge>=100)complete();};
  start();};},50);
ct('Notification Viewed',{game:'green_charge',season:'earth_day'});
</script></body></html>
