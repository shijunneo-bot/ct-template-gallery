<!DOCTYPE html>
<!-- ============================================================
  G151 — NEURON/BEAM "DODGE UP" · Vertical Dodge-Climber
  Mechanic: barrel-dodge vertical climb LOGIC (Donkey-Kong-spirit, public-domain
  genre) — ascend levels while dodging rolling obstacles. NO trademarked
  characters/names/art (no gorilla, no Jumpman, no named barrels). Brand-skinned
  as a rider weaving uphill past hazards to a safe parking zone.
  NEW arcade vertical. Surface: in-app Custom HTML. Grade B.
  Lifecycle: engagement (safety/skill, brand-appropriate for micromobility).
  SETS: {{profile.climb_level}}. PROMOS: ride credit at top.
  Brand: Neuron/Beam (merging) — teal/coral generic, figures illustrative.
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#0e7e7a"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beam · Dodge Up</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#1AB5B0;--deep:var(--cfg-accent,#0e7e7a);--coral:#FF6B5E;--ink:#0C2422;--paper:#F0FBFA;--soft:#D2EFED}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;min-height:100vh;background:linear-gradient(165deg,#0a2e2b,#061715);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(4,16,15,.64);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:24px;box-shadow:0 26px 64px rgba(4,20,18,.5);overflow:hidden}
.hd{padding:14px 20px 8px;position:relative;text-align:center}
.brand{font:800 11px Sora;letter-spacing:3px;color:#4a9c98;margin-bottom:4px}
.x{position:absolute;top:11px;right:14px;width:30px;height:30px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer}
h1{font-family:Sora;font-weight:800;font-size:18px;color:var(--ink)}
.hd p{font-size:11px;color:#5a8a86;margin-top:3px;line-height:1.4}
.hud{display:flex;justify-content:space-between;padding:4px 24px;font:800 11px Sora;color:var(--deep)}
.stage{display:flex;justify-content:center;padding:6px 0 4px}
#cv{background:linear-gradient(180deg,#e6f7f5,#d2efed);border:2px solid var(--soft);border-radius:10px;touch-action:none}
.ctrls{display:flex;gap:10px;padding:8px 20px 4px;justify-content:center}
.cbtn{flex:1;max-width:120px;border:0;border-radius:11px;padding:14px 0;background:#fff;border:2px solid var(--soft);font-size:20px;cursor:pointer;color:var(--deep)}
.cbtn:active{background:var(--soft)}
.body{padding:6px 20px 16px;text-align:center}
.status{font:700 11px Inter;color:#5a8a86;min-height:15px;margin-bottom:8px}
.status b{color:var(--deep)}
.btn{width:100%;border:0;border-radius:13px;padding:13px;background:var(--teal);color:#fff;font:800 14px Sora;cursor:pointer;box-shadow:0 5px 0 var(--deep)}
.btn:disabled{opacity:.55;box-shadow:none}
.ctlog{margin-top:9px;font:700 10px ui-monospace,monospace;color:#4a9c98;background:#e0f5f3;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">BEAM</div>
    <h1>Dodge Up 🛴</h1>
    <p>Weave uphill past the hazards. Reach the safe parking zone at the top to bank a ride credit!</p>
  </div>
  <div class="hud"><span>Level: <span id="level">1</span></span><span>Height: <span id="height">0</span>m</span></div>
  <div class="stage"><canvas id="cv" width="220" height="300"></canvas></div>
  <div class="ctrls">
    <button class="cbtn" onmousedown="hold(-1)" onmouseup="release()" ontouchstart="hold(-1)" ontouchend="release()">◀</button>
    <button class="cbtn" onmousedown="hold(1)" onmouseup="release()" ontouchstart="hold(1)" ontouchend="release()">▶</button>
  </div>
  <div class="body">
    <div class="status" id="status">Tap Start, then dodge left/right!</div>
    <button class="btn" id="start">START CLIMB</button>
    
  </div>
</div></div>
<script>
/* Vertical dodge-climb LOGIC (public-domain genre). Brand rider auto-climbs;
   player dodges rolling hazards. No IP characters/art. SETS profile.climb_level. */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const W=cv.width,H=cv.height;
let rider,hazards,height,level,playing=false,dir=0,loopT=null,won=false,spawnT=0;
function ct(ev,p){console.log('CleverTap:',ev,p);}
function reset(){rider={x:W/2,y:H-30,r:11};hazards=[];height=0;level=1;won=false;spawnT=0;
 document.getElementById('level').textContent='1';document.getElementById('height').textContent='0';}
function hold(d){dir=d;}
function release(){dir=0;}
function spawnHazard(){const lane=20+Math.random()*(W-40);
 hazards.push({x:lane,y:-14,r:10,vy:1.6+level*0.25,vx:(Math.random()-.5)*1.2});}
function step(){if(!playing)return;
 rider.x+=dir*3.4;rider.x=Math.max(rider.r,Math.min(W-rider.r,rider.x));
 height+=0.4;const m=Math.floor(height);
 document.getElementById('height').textContent=m;
 const nl=1+Math.floor(m/40);
 if(nl>level){level=nl;document.getElementById('level').textContent=level;
  ct('level_up',{climb_level:level});status.innerHTML='Level <b>'+level+'</b>! Keep climbing.';}
 spawnT++;if(spawnT>Math.max(22-level*2,9)){spawnT=0;spawnHazard();}
 hazards.forEach(h=>{h.y+=h.vy;h.x+=h.vx;if(h.x<h.r||h.x>W-h.r)h.vx*=-1;});
 hazards=hazards.filter(h=>h.y<H+20);
 for(const h of hazards){const dx=h.x-rider.x,dy=h.y-rider.y;
  if(Math.hypot(dx,dy)<h.r+rider.r){return crash();}}
 if(m>=200&&!won){won=true;return winGame();}
 draw();}
function draw(){cx.clearRect(0,0,W,H);
 // finish zone near top once close
 if(height>=160){cx.fillStyle='rgba(26,181,176,.18)';cx.fillRect(0,0,W,30);
  cx.fillStyle=CONFIG.accentColor;cx.font='bold 11px Sora';cx.textAlign='center';cx.fillText('🅿️ SAFE ZONE',W/2,20);}
 hazards.forEach(h=>{cx.font=(h.r*2)+'px serif';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText('⚠️',h.x,h.y);});
 cx.font='22px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🛴',rider.x,rider.y);}
function start(){reset();playing=true;status.textContent='Dodge the hazards — climb to the top!';
 document.getElementById('start').style.display='none';
 if(loopT)clearInterval(loopT);loopT=setInterval(step,28);
 ct('game_started',{game:'dodge_up'});}
function crash(){playing=false;clearInterval(loopT);
 status.innerHTML='💥 Hazard hit! You reached <b>'+Math.floor(height)+'m</b>';
 const b=document.getElementById('start');b.style.display='block';b.textContent='TRY AGAIN';b.disabled=false;b.onclick=start;
 ct('game_over',{height:Math.floor(height),climb_level:level});}
function winGame(){playing=false;clearInterval(loopT);draw();
 status.innerHTML='🎉 Reached the safe zone! Level <b>'+level+'</b>';
 const b=document.getElementById('start');b.style.display='block';b.textContent='CLAIM RIDE CREDIT 🎁';b.disabled=false;
 ct('summit_reached',{climb_level:level});
 b.onclick=()=>{ct('reward_won',{reward:'ride_credit'});b.textContent='CREDIT BANKED ✓';b.disabled=true;};}
document.getElementById('start').onclick=start;
draw();
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')hold(-1);else if(e.key==='ArrowRight')hold(1);});
window.addEventListener('keyup',release);
ct('Notification Viewed',{game:'dodge_up',mechanic:'vertical_climber'});
</script></body></html>
