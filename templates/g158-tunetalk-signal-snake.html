<!DOCTYPE html>
<!-- ============================================================
  G158 — TUNE TALK "SIGNAL SNAKE" · Snake Growth
  Mechanic: snake LOGIC (public-domain genre) — steer a growing trail to eat
  pickups, don't hit yourself/walls. NO trademarked art/names. Brand-skinned as
  a signal line growing as it collects data bars.
  Fills arcade gap (snake). Surface: in-app Custom HTML. Grade B.
  Lifecycle: engagement (telco, playful).
  SETS: {{profile.snake_best}}. PROMOS: bonus data at length tier.
  Brand: Tune Talk orange #F36F21 (verified)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#f36f21"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tune Talk · Signal Snake</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&family=Karla:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--org:var(--cfg-accent,#f36f21);--deep:#C2511A;--grn:#2FA85B;--ink:#221208;--paper:#FFFAF5;--soft:#FBE9DC}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Karla,sans-serif;min-height:100vh;background:linear-gradient(165deg,#3a2310,#1c1206);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(22,11,3,.6);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:24px;box-shadow:0 26px 64px rgba(40,20,5,.5);overflow:hidden}
.hd{padding:14px 20px 8px;position:relative;text-align:center}
.brand{font:800 11px Karla;letter-spacing:3px;color:#c9966c;margin-bottom:4px}
.x{position:absolute;top:11px;right:14px;width:30px;height:30px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer}
h1{font-family:Rubik;font-weight:800;font-size:19px;color:var(--ink)}
.hd p{font-size:11px;color:#9b7f6f;margin-top:3px;line-height:1.4}
.hud{display:flex;justify-content:space-between;padding:4px 24px;font:800 12px Rubik;color:var(--deep)}
.stage{display:flex;justify-content:center;padding:6px 0 4px}
#cv{background:#fffdf9;border:2px solid var(--soft);border-radius:10px;touch-action:none}
.ctrls{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,40px);gap:5px;justify-content:center;padding:8px 0 4px}
.dpad{border:0;border-radius:10px;background:#fff;border:2px solid var(--soft);font-size:17px;color:var(--deep);cursor:pointer}
.dpad:active{background:var(--soft)}
.dpad.up{grid-column:2;grid-row:1}.dpad.left{grid-column:1;grid-row:2}
.dpad.down{grid-column:2;grid-row:2}.dpad.right{grid-column:3;grid-row:2}
.body{padding:4px 20px 16px;text-align:center}
.status{font:700 11px Karla;color:#9b7f6f;min-height:15px;margin-bottom:8px}
.status b{color:var(--deep)}
.btn{width:100%;border:0;border-radius:13px;padding:13px;background:var(--org);color:#fff;font:800 14px Rubik;cursor:pointer;box-shadow:0 5px 0 var(--deep)}
.btn:disabled{opacity:.55;box-shadow:none}
.ctlog{margin-top:9px;font:700 10px ui-monospace,monospace;color:#b8916c;background:#f7e8da;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">TUNE TALK</div>
    <h1>Signal Snake 📶</h1>
    <p>Grow your signal line by collecting data bars. Reach length 12 for a bonus-data reward — don't cross your own trail!</p>
  </div>
  <div class="hud"><span>Length: <span id="len">3</span></span><span>Best: 12</span></div>
  <div class="stage"><canvas id="cv" width="240" height="240"></canvas></div>
  <div class="ctrls">
    <button class="dpad up" onclick="setDir(0,-1)">▲</button>
    <button class="dpad left" onclick="setDir(-1,0)">◀</button>
    <button class="dpad down" onclick="setDir(0,1)">▼</button>
    <button class="dpad right" onclick="setDir(1,0)">▶</button>
  </div>
  <div class="body">
    <div class="status" id="status">Tap Start, then steer with the arrows!</div>
    <button class="btn" id="start">START GROWING</button>
    
  </div>
</div></div>
<script>
/* Snake LOGIC (public-domain genre). Signal trail grows on data-bar pickups.
   No IP art. SETS profile.snake_best. PROMOS at length 12. */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const N=12,CELL=20; // 12x12 grid
let snake,dir,nextDir,food,len,playing=false,loopT=null,won=false;
function ct(ev,p){console.log('CleverTap:',ev,p);}
function reset(){snake=[{x:5,y:6},{x:4,y:6},{x:3,y:6}];dir={x:1,y:0};nextDir={x:1,y:0};
 len=3;won=false;placeFood();document.getElementById('len').textContent='3';}
function placeFood(){let ok=false;while(!ok){food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};
 ok=!snake.some(s=>s.x===food.x&&s.y===food.y);}}
function setDir(x,y){if(x===-dir.x&&y===-dir.y)return;nextDir={x,y};}
function step(){if(!playing)return;dir=nextDir;
 const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){return dead();}
 snake.unshift(head);
 if(head.x===food.x&&head.y===food.y){len++;document.getElementById('len').textContent=len;
  ct('data_bar_eaten',{length:len});placeFood();
  if(len>=12&&!won){won=true;return winGame();}}
 else{snake.pop();}
 draw();}
function draw(){cx.clearRect(0,0,cv.width,cv.height);
 // food = data bar
 cx.font='15px serif';cx.textAlign='center';cx.textBaseline='middle';
 cx.fillText('📶',food.x*CELL+CELL/2,food.y*CELL+CELL/2);
 // snake
 snake.forEach((s,i)=>{cx.fillStyle=i===0?'#C2511A':CONFIG.accentColor;
  cx.fillRect(s.x*CELL+2,s.y*CELL+2,CELL-4,CELL-4);
  if(i===0){cx.fillStyle='#fff';cx.fillRect(s.x*CELL+5,s.y*CELL+6,3,3);cx.fillRect(s.x*CELL+CELL-8,s.y*CELL+6,3,3);}});}
function start(){reset();playing=true;status.textContent='Collect the data bars — grow to 12!';
 document.getElementById('start').style.display='none';
 if(loopT)clearInterval(loopT);loopT=setInterval(step,200);
 ct('game_started',{game:'signal_snake'});}
function dead(){playing=false;clearInterval(loopT);
 status.innerHTML='Signal lost! You reached length <b>'+len+'</b>';
 const b=document.getElementById('start');b.style.display='block';b.textContent='TRY AGAIN';b.disabled=false;b.onclick=start;
 ct('game_over',{length:len,snake_best:len});}
function winGame(){playing=false;clearInterval(loopT);draw();
 status.innerHTML='🎉 Full signal! Length <b>'+len+'</b>';
 const b=document.getElementById('start');b.style.display='block';b.textContent='CLAIM BONUS DATA 📶';b.disabled=false;
 ct('length_tier_reached',{snake_best:len});
 b.onclick=()=>{ct('reward_won',{reward:'bonus_data'});b.textContent='DATA ADDED ✓';b.disabled=true;};}
document.getElementById('start').onclick=start;
reset();draw();
window.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
 if(m[e.key])setDir(m[e.key][0],m[e.key][1]);});
ct('Notification Viewed',{game:'signal_snake',mechanic:'snake'});
</script></body></html>
