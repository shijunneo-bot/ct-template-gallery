<!DOCTYPE html>
<!-- ============================================================
  G78 — POS MALAYSIA "PARCEL SORT RUSH" · Conveyor Sorting Game
  Surface: Custom HTML In-App · Grade A → B
  Behavioral: fast-sort pressure + service-empathy (you ARE the sorter)
  Lifecycle: engagement (tracking-habit audience)
  Mechanic: parcels arrive tagged by zone; tap the matching chute fast.
  PROMOS: 15+ correct → postage voucher. Brand: Pos Malaysia red #E1251B (verify)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#e1251b"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pos Malaysia · Parcel Sort Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@600;800&family=Karla:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--red:var(--cfg-accent,#e1251b);--deep:#A8160E;--ink:#231312;--paper:#FFF8F7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Karla,sans-serif;min-height:100vh;background:linear-gradient(165deg,#5e1612,#2a0a08);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(20,4,3,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
.hd{background:var(--red);color:#fff;padding:15px 18px;position:relative;text-align:center}
.brand{font-family:Asap;font-weight:800;font-size:13px;letter-spacing:1px;margin-bottom:3px}
.x{position:absolute;top:11px;right:12px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.2);color:#fff;cursor:pointer}
h1{font-family:Asap;font-weight:800;font-size:19px}
.hd p{font-size:11px;opacity:.94;margin-top:3px}
.bar{display:flex;justify-content:space-between;padding:8px 24px 2px;font:800 11.5px Karla;color:#a8756a}
.bar b{color:var(--red)}
.belt{margin:8px 18px 0;background:#2f2422;border-radius:14px;padding:18px 14px;text-align:center;position:relative;overflow:hidden}
.belt::before{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,#555 0 14px,#333 14px 28px)}
.parcel{display:inline-block;animation:slidein .3s}
@keyframes slidein{from{transform:translateX(-40px);opacity:0}}
.parcel .pe{font-size:48px}
.parcel .ptag{font:800 13px Asap;color:#fff;background:var(--red);border-radius:8px;padding:3px 12px;display:inline-block;margin-top:4px}
.chutes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 18px 4px}
.chute{border:0;border-radius:13px;padding:13px 6px;cursor:pointer;text-align:center;background:#fff;border:2px solid #f0d8d4;transition:.12s}
.chute:active{transform:scale(.93)}
.chute i{font-style:normal;font-size:22px;display:block}
.chute span{font:800 10px Asap;color:var(--ink);display:block;margin-top:3px;letter-spacing:.5px}
.chute.flash-ok{border-color:#2f9e6e;background:#eaf7f0}
.chute.flash-no{border-color:#e35d5d;background:#fdeeee}
.body{padding:8px 20px 16px;text-align:center}
.result{display:none;margin-bottom:9px}
.result b{font-family:Asap;font-weight:800;font-size:17px;color:var(--red);display:block}
.result span{font-size:12px;color:#8a5f54}
.btn{width:100%;border:0;border-radius:13px;padding:13px;background:var(--red);color:#fff;font:800 14px Karla;cursor:pointer;box-shadow:0 5px 0 var(--deep)}
.ctlog{margin-top:10px;font:700 10.5px ui-monospace,monospace;color:#b08a84;background:#f8e7e5;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">POS MALAYSIA</div>
    <h1>PARCEL SORT RUSH 📦</h1>
    <p>You're on the sorting line! Send each parcel down the right zone chute. 25 seconds.</p>
  </div>
  <div class="bar"><span>SORTED <b id="sc">0</b></span><span>TIME <b id="tm">25</b>s</span></div>
  <div class="belt"><div class="parcel" id="parcel"><span class="pe">📦</span><div class="ptag" id="tag">—</div></div></div>
  <div class="chutes" id="chutes"></div>
  <div class="body">
    <div class="result" id="result"><b id="rT"></b><span id="rS"></span></div>
    <button class="btn" id="go">CLOCK IN · START SHIFT</button>
    
  </div>
</div></div>
<script>
/* Sort by zone. 15+ correct → Promos postage voucher. */
const ZONES=[['🏙️','KL / SELANGOR','central'],['🌴','SABAH / SARAWAK','east'],['🏖️','PENANG / NORTH','north']];
let score=0,time=25,running=false,timers=[],curZone=null;
function ct(ev,p){console.log('CleverTap:',ev,p);}
ZONES.forEach(z=>{const b=document.createElement('button');b.className='chute';
 b.innerHTML=`<i>${z[0]}</i><span>${z[1]}</span>`;
 b.onclick=()=>sort(z[2],b);chutes.appendChild(b);});
function nextParcel(){curZone=ZONES[Math.floor(Math.random()*ZONES.length)];
 const p=document.getElementById('parcel');
 p.style.animation='none';void p.offsetWidth;p.style.animation='';
 tag.textContent=curZone[1];}
function sort(zone,btn){if(!running||!curZone)return;
 const ok=zone===curZone[2];
 if(ok)score++;sc.textContent=score;
 btn.classList.add(ok?'flash-ok':'flash-no');
 setTimeout(()=>btn.classList.remove('flash-ok','flash-no'),200);
 ct('parcel_sorted',{correct:ok,score:score});
 nextParcel();}
go.onclick=()=>{if(running)return;
 running=true;score=0;time=25;sc.textContent=0;tm.textContent=25;
 result.style.display='none';go.textContent='SORTING…';
 ct('Game Played',{game:'parcel_sort'});nextParcel();
 timers.push(setInterval(()=>{time--;tm.textContent=time;if(time<=0)end();},1000));};
function end(){running=false;timers.forEach(clearInterval);timers=[];
 tag.textContent='SHIFT OVER';
 result.style.display='block';
 const win=score>=15;
 rT.textContent=score+' PARCELS SORTED!';
 rS.textContent=win?'Postal hero! 15+ in 25 seconds earns a postage voucher. The line salutes you. 📮':
  'Solid shift! 15 sorted unlocks a postage voucher. The conveyor never sleeps — rematch?';
 go.textContent=win?'CLAIM POSTAGE VOUCHER →':'NEXT SHIFT';
 ct('game_over',{score:score,reward:win?'postage_voucher':'none'});
 if(win)go.onclick=()=>{ct('reward_claimed',{reward:'postage_voucher'});
  go.textContent='SAVED ✓';go.disabled=true;};
 else go.onclick=()=>location.reload();}
ct('Notification Viewed',{game:'parcel_sort',trigger:'engagement'});
</script></body></html>
