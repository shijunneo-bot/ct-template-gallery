<!DOCTYPE html>
<!-- ============================================================
  G57 — PIZZA HUT SG "TOPPING DROP" · Canvas Catch Game
  Surface: Custom HTML In-App · Grade A (front-end) → B with Promos
  Behavioral: flow-state skill loop + score → reward tier
  Lifecycle: engagement (lunch-window push companion)
  Mechanic: move the pizza base (drag/arrows), catch toppings, dodge burnt ones.
  PROMOS: score tier → topping voucher. Brand: Pizza Hut red #EE3A43 (verified)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#ee3a43"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Hut · Topping Drop</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Karla:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--red:var(--cfg-accent,#ee3a43);--deep:#B71C24;--ink:#2B1212;--paper:#FFF9F5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Karla,sans-serif;min-height:100vh;background:linear-gradient(165deg,#7e1b21,#3c0c0f);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(30,6,7,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:22px;box-shadow:0 26px 64px rgba(0,0,0,.55);overflow:hidden}
.hd{background:var(--red);color:#fff;padding:14px 18px;position:relative;text-align:center}
.brand{font-family:'Lilita One';font-size:14px;letter-spacing:1px;margin-bottom:3px}
.x{position:absolute;top:11px;right:12px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.2);color:#fff;cursor:pointer}
h1{font-family:'Lilita One';font-size:19px}
.bar{display:flex;justify-content:space-between;padding:9px 20px 2px;font:800 11.5px Karla;color:#8a5f54}
.bar b{color:var(--red)}
.stage{display:flex;justify-content:center;padding:6px 0 2px}
canvas{border-radius:14px;background:linear-gradient(180deg,#FFF3E4,#FFE7CB);border:2px solid #f2dcc8;touch-action:none}
.hint{text-align:center;font:800 10px Karla;letter-spacing:1.5px;color:#b08a7d;padding:7px 0 0}
.body{padding:8px 20px 16px;text-align:center}
.result{display:none;margin-bottom:9px}
.result b{font-family:'Lilita One';font-size:18px;color:var(--red);display:block}
.result span{font-size:12px;color:#8a5f54}
.btn{width:100%;border:0;border-radius:13px;padding:13px;background:var(--red);color:#fff;font:800 14px Karla;cursor:pointer;box-shadow:0 5px 0 var(--deep)}
.ctlog{margin-top:10px;font:700 10.5px ui-monospace,monospace;color:#b08a7d;background:#f7e6dd;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">PIZZA HUT</div>
    <h1>TOPPING DROP 🍕</h1>
  </div>
  <div class="bar"><span>SCORE <b id="sc">0</b></span><span>TIME <b id="tm">30</b>s</span></div>
  <div class="stage"><canvas id="cv" width="300" height="280"></canvas></div>
  <div class="hint">DRAG THE BASE · CATCH FRESH · DODGE BURNT 🔥</div>
  <div class="body">
    <div class="result" id="result"><b id="rT"></b><span id="rS"></span></div>
    <button class="btn" id="go">START THE DROP</button>
    
  </div>
</div></div>
<script>
/* Score tiers → Promos topping voucher: 150+ free topping, 250+ free side. */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
let px=130,items=[],score=0,time=30,running=false,timers=[];
const GOOD=['🍄','🫑','🧀','🍅','🥓'],BAD='🔥';
function ct(ev,p){console.log('CleverTap:',ev,p);}
function draw(){cx.clearRect(0,0,300,280);
 cx.font='26px serif';
 items.forEach(it=>cx.fillText(it.e,it.x,it.y));
 // base
 cx.fillStyle='#F2C063';cx.beginPath();cx.ellipse(px+35,262,38,12,0,0,7);cx.fill();
 cx.fillStyle='#E8443F';cx.beginPath();cx.ellipse(px+35,260,30,9,0,0,7);cx.fill();
 cx.fillStyle='#F7D560';cx.beginPath();cx.ellipse(px+35,258,26,7,0,0,7);cx.fill();}
function spawn(){if(!running)return;
 const bad=Math.random()<.28;
 items.push({e:bad?BAD:GOOD[Math.floor(Math.random()*GOOD.length)],
  x:14+Math.random()*256,y:-10,v:1.7+Math.random()*1.6,bad:bad});}
function tick(){if(!running)return;
 items.forEach(it=>it.y+=it.v);
 items=items.filter(it=>{
  if(it.y>238&&it.y<272&&it.x>px-6&&it.x<px+76){
   if(it.bad){score=Math.max(0,score-15);}else score+=10;
   sc.textContent=score;return false;}
  return it.y<290;});
 draw();requestAnimationFrame(tick);}
function move(e){const r=cv.getBoundingClientRect();
 const t=e.touches?e.touches[0]:e;
 px=Math.max(0,Math.min(230,(t.clientX-r.left)-35));
 if(e.touches)e.preventDefault();}
cv.addEventListener('mousemove',move);
cv.addEventListener('touchmove',move,{passive:false});
go.onclick=()=>{if(running)return;
 running=true;score=0;time=30;items=[];sc.textContent=0;tm.textContent=30;
 result.style.display='none';go.textContent='CATCHING…';
 ct('Game Played',{game:'topping_drop'});
 timers.push(setInterval(spawn,520));
 timers.push(setInterval(()=>{time--;tm.textContent=time;
  if(time<=0)end();},1000));
 tick();};
function end(){running=false;timers.forEach(clearInterval);timers=[];
 result.style.display='block';
 const tier=score>=250?'free side':score>=150?'free topping':null;
 rT.textContent=score+' POINTS!';
 rS.textContent=tier?('Tier unlocked: '+tier+' on your next order. Chef\'s kiss. 👨‍🍳'):
  'So close — 150 unlocks a free topping. One more drop?';
 go.textContent=tier?'CLAIM MY '+tier.toUpperCase()+' →':'DROP AGAIN';
 ct('game_over',{score:score,reward:tier||'none'});
 if(tier){go.onclick=()=>{ /* PROMOS: tiered voucher */
  ct('reward_claimed',{reward:tier});
  go.textContent='CLAIMED ✓';go.disabled=true;};}}
draw();
ct('Notification Viewed',{game:'topping_drop',trigger:'lunch_window'});
</script></body></html>
