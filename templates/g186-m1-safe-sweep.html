<!DOCTYPE html>
<!-- ============================================================
  G186 — M1 "SAFE SWEEP" · Minesweeper-Lite Deduction Grid
  Mechanic: minesweeper LOGIC (public-domain genre) — reveal cells; numbers show
  adjacent hazard count; flag hazards; clear all safe cells to win. NO trademarked
  art/names. Brand-skinned as sweeping a signal grid for interference. SWAPPED IN
  for fruit-slice (cleaner cold demo, pure logic). NEW FAMILY (minesweeper) — 0
  prior files. Surface: in-app interstitial. Grade B. Lifecycle: engagement.
  SETS: {{profile.sweep_solved}}. PROMOS: data on clear. Brand: M1 (approx — verify)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#9a7080"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 · Safe Sweep</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Mulish:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--org:#FF6B2C;--mag:#E5007D;--grn:#3FAE6A;--ink:#241019;--paper:#FFF6F1;--soft:#FCE3D8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Mulish,sans-serif;min-height:100vh;background:linear-gradient(165deg,#2c1018,#160810);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(16,5,10,.6);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:24px;box-shadow:0 26px 64px rgba(20,8,14,.5);overflow:hidden}
.hd{padding:13px 20px 6px;position:relative;text-align:center}
.brand{font:800 11px Mulish;letter-spacing:3px;color:var(--mag);margin-bottom:3px}
.x{position:absolute;top:11px;right:14px;width:30px;height:30px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer}
h1{font-family:Fraunces;font-size:20px;color:var(--ink)}
.hd p{font-size:10.5px;color:var(--cfg-accent,#9a7080);margin-top:2px;line-height:1.35}
.hud{display:flex;justify-content:space-between;padding:3px 24px;font:800 11px Mulish;color:var(--mag)}
.toolbar{display:flex;justify-content:center;gap:8px;padding:4px 0}
.tool{border:0;border-radius:9px;padding:7px 14px;background:#fff;border:2px solid var(--soft);font:800 11px Mulish;cursor:pointer;color:var(--cfg-accent,#9a7080)}
.tool.active{background:var(--mag);color:#fff;border-color:var(--mag)}
.grid{display:grid;gap:3px;justify-content:center;padding:8px 20px 4px}
.cell{width:30px;height:30px;border-radius:6px;background:linear-gradient(150deg,#ffd9c7,#ffc4ad);border:0;cursor:pointer;font:800 13px Mulish;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.cell.revealed{background:#fff;border:1px solid var(--soft)}
.cell.flag{background:#fff0c4}
.cell.hazard{background:var(--mag);color:#fff}
.body{padding:6px 20px 14px;text-align:center}
.status{font:700 10.5px Mulish;color:var(--cfg-accent,#9a7080);min-height:14px;margin-bottom:7px}
.status b{color:var(--mag)}
.btn{width:100%;border:0;border-radius:13px;padding:12px;background:linear-gradient(135deg,var(--org),var(--mag));color:#fff;font:800 13px Mulish;cursor:pointer;box-shadow:0 5px 0 #b3145e}
.btn:disabled{opacity:.55;box-shadow:none}
.ctlog{margin-top:8px;font:700 9.5px ui-monospace,monospace;color:#b88a9a;background:#f8e6ee;border-radius:8px;padding:6px 9px;text-align:left;min-height:28px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">M1</div>
    <h1>Safe Sweep 📡</h1>
    <p>Numbers show how many interference cells touch that tile. Reveal all safe tiles (flag the hazards) to win!</p>
  </div>
  <div class="hud"><span>Hazards: <span id="mines">0</span></span><span>Flags: <span id="flags">0</span></span></div>
  <div class="toolbar">
    <button class="tool active" id="toolReveal" onclick="setTool('reveal')">👆 Reveal</button>
    <button class="tool" id="toolFlag" onclick="setTool('flag')">🚩 Flag</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="body">
    <div class="status" id="status">Tap Start to scan the grid!</div>
    <button class="btn" id="start">START</button>
    
  </div>
</div></div>
<script>
/* Minesweeper LOGIC (public-domain genre). 7x7, 8 hazards. First-click safe.
   IP-neutral. SETS profile.sweep_solved. */
const N=7,MINES=8;
let grid,revealed,flagged,playing=false,won=false,tool='reveal',firstClick,flagCount;
function ct(ev,p){console.log('CleverTap:',ev,p);}
function setTool(t){tool=t;document.getElementById('toolReveal').classList.toggle('active',t==='reveal');
 document.getElementById('toolFlag').classList.toggle('active',t==='flag');}
function reset(){grid=Array.from({length:N},()=>Array(N).fill(0));
 revealed=Array.from({length:N},()=>Array(N).fill(false));
 flagged=Array.from({length:N},()=>Array(N).fill(false));
 won=false;firstClick=true;flagCount=0;
 document.getElementById('mines').textContent=MINES;document.getElementById('flags').textContent='0';}
function placeMines(safeR,safeC){let placed=0;
 while(placed<MINES){const r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);
  if(grid[r][c]===-1)continue;if(Math.abs(r-safeR)<=1&&Math.abs(c-safeC)<=1)continue; // keep first click area clear
  grid[r][c]=-1;placed++;}
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(grid[r][c]===-1)continue;
  let n=0;neighbors(r,c).forEach(([nr,nc])=>{if(grid[nr][nc]===-1)n++;});grid[r][c]=n;}}
function neighbors(r,c){const out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
  if(dr===0&&dc===0)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nr<N&&nc>=0&&nc<N)out.push([nr,nc]);}return out;}
function render(){const el=document.getElementById('grid');el.style.gridTemplateColumns='repeat('+N+',30px)';el.innerHTML='';
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const b=document.createElement('button');
  if(revealed[r][c]){b.className='cell revealed';
   if(grid[r][c]===-1){b.classList.add('hazard');b.textContent='📵';}
   else if(grid[r][c]>0){b.textContent=grid[r][c];b.style.color=['','#2F8Fd8','#3FAE6A','#E5007D','#7C3AED','#FF6B2C'][Math.min(grid[r][c],5)];}}
  else if(flagged[r][c]){b.className='cell flag';b.textContent='🚩';}
  else{b.className='cell';}
  b.onclick=()=>click(r,c);el.appendChild(b);}}
function click(r,c){if(!playing||won||revealed[r][c])return;
 if(tool==='flag'){if(!revealed[r][c]){flagged[r][c]=!flagged[r][c];
  flagCount+=flagged[r][c]?1:-1;document.getElementById('flags').textContent=flagCount;
  ct('cell_flagged',{flags:flagCount});render();}return;}
 if(flagged[r][c])return;
 if(firstClick){placeMines(r,c);firstClick=false;}
 if(grid[r][c]===-1){revealed[r][c]=true;return lose();}
 flood(r,c);ct('cell_revealed',{r,c});render();checkWin();}
function flood(r,c){if(revealed[r][c]||flagged[r][c])return;revealed[r][c]=true;
 if(grid[r][c]===0){neighbors(r,c).forEach(([nr,nc])=>{if(!revealed[nr][nc])flood(nr,nc);});}}
function checkWin(){let safeLeft=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  if(grid[r][c]!==-1&&!revealed[r][c])safeLeft++;}
 if(safeLeft===0){won=true;win();}
 else status.innerHTML='Keep sweeping — <b>'+safeLeft+'</b> safe tiles left';}
function start(){reset();playing=true;setTool('reveal');status.textContent='Reveal a tile to begin (first tap is always safe).';
 document.getElementById('start').style.display='none';render();
 ct('game_started',{game:'safe_sweep'});}
function lose(){playing=false;
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(grid[r][c]===-1)revealed[r][c]=true;}render();
 status.innerHTML='📵 Hit interference! Try again.';
 const b=document.getElementById('start');b.style.display='block';b.textContent='TRY AGAIN';b.disabled=false;b.onclick=start;
 ct('game_over',{sweep_solved:false});}
function win(){playing=false;render();
 status.innerHTML='🎉 Grid swept clean! Sharp deduction.';
 const b=document.getElementById('start');b.style.display='block';b.textContent='CLAIM DATA REWARD 📶';b.disabled=false;
 ct('puzzle_solved',{sweep_solved:true});
 b.onclick=()=>{ct('reward_won',{reward:'bonus_data'});b.textContent='DATA ADDED ✓';b.disabled=true;};}
document.getElementById('start').onclick=start;
reset();render();
ct('Notification Viewed',{game:'safe_sweep',mechanic:'minesweeper'});
</script></body></html>
