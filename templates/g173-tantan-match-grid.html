<!DOCTYPE html>
<!-- ============================================================
  G173 — TANTAN "MATCH GRID" · Tic-Tac-Toe vs CPU
  Mechanic: tic-tac-toe LOGIC (Noughts & Crosses, public-domain) — 3x3, get three
  in a row vs a CPU opponent (minimax-lite with a beatable miss chance). NO
  trademarked art/names. Brand-skinned as a playful match-up game (TanTan = social
  matching context). NEW FAMILY (board vs CPU) — 0 prior files. Surface: in-app
  interstitial. Grade B. Lifecycle: engagement. SETS: {{profile.ttt_wins}}.
  PROMOS: boost on win. Brand: TanTan pink/coral (approx — verify)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#c97f93"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TanTan · Match Grid</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#FF4E78;--deep:#D62E58;--blue:#3A8DFF;--gold:#F5A623;--ink:#2A0E18;--paper:#FFF4F7;--soft:#FCDDE6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;min-height:100vh;background:linear-gradient(165deg,#3a1020,#1c0810);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(18,5,10,.6);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:24px;box-shadow:0 26px 64px rgba(20,8,14,.5);overflow:hidden}
.hd{padding:14px 20px 8px;position:relative;text-align:center}
.brand{font:700 11px Quicksand;letter-spacing:3px;color:var(--cfg-accent,#c97f93);margin-bottom:4px}
.x{position:absolute;top:11px;right:14px;width:30px;height:30px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer}
h1{font-family:Quicksand;font-weight:700;font-size:19px;color:var(--ink)}
.hd p{font-size:10.5px;color:#9a6a78;margin-top:2px;line-height:1.35}
.hud{display:flex;justify-content:space-between;padding:4px 24px;font:700 12px Quicksand;color:var(--deep)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 40px 6px}
.cell{aspect-ratio:1;border-radius:16px;background:#fff;border:2px solid var(--soft);cursor:pointer;font-size:38px;display:flex;align-items:center;justify-content:center;transition:.12s}
.cell:active:not(.filled){transform:scale(.95)}
.cell.filled{cursor:default}
.cell.win{background:#fff0c4;border-color:var(--gold)}
.body{padding:10px 20px 16px;text-align:center}
.status{font:700 11px Inter;color:#9a6a78;min-height:15px;margin-bottom:8px}
.status b{color:var(--deep)}
.btn{width:100%;border:0;border-radius:13px;padding:13px;background:var(--pink);color:#fff;font:700 14px Quicksand;cursor:pointer;box-shadow:0 5px 0 var(--deep)}
.btn:disabled{opacity:.55;box-shadow:none}
.ctlog{margin-top:9px;font:700 10px ui-monospace,monospace;color:var(--cfg-accent,#c97f93);background:#fce2e9;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">TANTAN</div>
    <h1>Match Grid 💘</h1>
    <p>You're 💖, the app is 💙. Get three in a row to win a profile boost. Best of luck!</p>
  </div>
  <div class="hud"><span>You: <span id="pw">0</span></span><span>Draws: <span id="dr">0</span></span><span>App: <span id="cw">0</span></span></div>
  <div class="grid" id="grid"></div>
  <div class="body">
    <div class="status" id="status">Tap Start, then take a square!</div>
    <button class="btn" id="start">START</button>
    
  </div>
</div></div>
<script>
/* Tic-tac-toe LOGIC (public-domain). Player vs CPU; CPU uses win/block heuristic
   with a small miss chance so it's beatable. IP-neutral. SETS profile.ttt_wins. */
const P='💖',C='💙';
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board,turn,playing=false,pw=0,cw=0,dr=0,over=false;
function ct(ev,p){console.log('CleverTap:',ev,p);}
function render(winLine){const g=document.getElementById('grid');g.innerHTML='';
 board.forEach((v,i)=>{const c=document.createElement('div');
  c.className='cell'+(v?' filled':'')+(winLine&&winLine.includes(i)?' win':'');
  c.textContent=v||'';c.onclick=()=>playerMove(i);g.appendChild(c);});}
function winner(b){for(const L of LINES){const[a,c,d]=L;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return {who:b[a],line:L};}
 if(b.every(Boolean))return {who:'draw'};return null;}
function playerMove(i){if(!playing||over||board[i])return;board[i]=P;ct('player_move',{cell:i});
 let w=winner(board);if(w)return finish(w);
 render();turn=C;setTimeout(cpuMove,420);status.textContent='App is thinking…';}
function cpuMove(){if(over)return;
 let move=bestMove(C); // tries to win, then block, then center/corner; small miss chance
 if(Math.random()<0.18){const empties=board.map((v,i)=>v?null:i).filter(i=>i!==null);
  if(empties.length)move=empties[Math.floor(Math.random()*empties.length)];}
 board[move]=C;ct('cpu_move',{cell:move});
 let w=winner(board);if(w)return finish(w);
 render();turn=P;status.textContent='Your move!';}
function bestMove(who){const opp=who===C?P:C;return fallbackMove(who,opp);}
function fallbackMove(who,opp){
 const empt=i=>!board[i];
 // win
 for(const L of LINES){const o=L.filter(i=>board[i]===who).length;const e=L.filter(empt);
  if(o===2&&e.length===1)return e[0];}
 // block
 for(const L of LINES){const o=L.filter(i=>board[i]===opp).length;const e=L.filter(empt);
  if(o===2&&e.length===1)return e[0];}
 if(empt(4))return 4;
 const corners=[0,2,6,8].filter(empt);if(corners.length)return corners[Math.floor(Math.random()*corners.length)];
 const any=[0,1,2,3,4,5,6,7,8].filter(empt);return any[Math.floor(Math.random()*any.length)];}
function finish(w){over=true;playing=false;
 if(w.who==='draw'){dr++;document.getElementById('dr').textContent=dr;status.innerHTML='🤝 It\'s a draw!';
  ct('game_result',{result:'draw'});resetBtn('PLAY AGAIN',start);}
 else if(w.who===P){pw++;document.getElementById('pw').textContent=pw;render(w.line);
  status.innerHTML='🎉 You win! Three in a row.';ct('game_result',{result:'player_win',ttt_wins:pw});
  const b=document.getElementById('start');b.style.display='block';b.textContent='CLAIM PROFILE BOOST 🎁';b.disabled=false;
  b.onclick=()=>{ct('reward_won',{reward:'profile_boost'});b.textContent='BOOST CLAIMED ✓';b.disabled=true;};}
 else{cw++;document.getElementById('cw').textContent=cw;render(w.line);
  status.innerHTML='The app got it this time! Rematch?';ct('game_result',{result:'cpu_win'});resetBtn('REMATCH',start);}}
function resetBtn(label,fn){const b=document.getElementById('start');b.style.display='block';b.textContent=label;b.disabled=false;b.onclick=fn;}
function start(){board=Array(9).fill(undefined);turn=P;over=false;playing=true;
 status.textContent='Your move — take a square!';document.getElementById('start').style.display='none';render();
 ct('game_started',{game:'match_grid'});}
document.getElementById('start').onclick=start;
board=Array(9).fill(undefined);render();
ct('Notification Viewed',{game:'match_grid',mechanic:'tic_tac_toe'});
</script></body></html>
