<!DOCTYPE html>
<!-- ============================================================
  G161 — TUNE TALK "SIGNAL TRAIL" · Snake + Flip-Card Hybrid
  Spec E (deque-crawler + flip-card). IP-neutral snake logic: deque movement,
  dot-product reversal guard, grow-on-eat. Reward layer = eating food spawns a
  face-down card on the grid; navigate to flip it (HONEST odds, no manipulation).
  NO trademarked art/names. Brand-skinned as a signal trail collecting boosts.
  Surface: in-app interstitial. Grade B. Lifecycle: engagement (telco).
  SETS: {{profile.trail_best}}. PROMOS: data reward on milestone.
  NOT for White Hat accounts. Brand: Tune Talk orange #F36F21 (verified)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#f36f21"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tune Talk · Signal Trail</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&family=Karla:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--org:var(--cfg-accent,#f36f21);--deep:#C2511A;--grn:#2FA85B;--blu:#2F8Fd8;--red:#E1251B;--ink:#221208;--paper:#FFFAF5;--soft:#FBE9DC}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Karla,sans-serif;min-height:100vh;background:linear-gradient(165deg,#3a2310,#1c1206);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(22,11,3,.6);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:24px;box-shadow:0 26px 64px rgba(40,20,5,.5);overflow:hidden}
.hd{padding:13px 20px 6px;position:relative;text-align:center}
.brand{font:800 11px Karla;letter-spacing:3px;color:#c9966c;margin-bottom:3px}
.x{position:absolute;top:11px;right:14px;width:30px;height:30px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer}
h1{font-family:Rubik;font-weight:800;font-size:18px;color:var(--ink)}
.hd p{font-size:10.5px;color:#9b7f6f;margin-top:2px;line-height:1.35}
.hud{display:flex;justify-content:space-between;padding:3px 24px;font:800 11px Rubik;color:var(--deep)}
.stage{display:flex;justify-content:center;padding:4px 0 2px}
#cv{background:#fffdf9;border:2px solid var(--soft);border-radius:10px;touch-action:none}
.ctrls{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,38px);gap:5px;justify-content:center;padding:6px 0 2px}
.dpad{border:0;border-radius:10px;background:#fff;border:2px solid var(--soft);font-size:16px;color:var(--deep);cursor:pointer}
.dpad:active{background:var(--soft)}
.dpad.up{grid-column:2;grid-row:1}.dpad.left{grid-column:1;grid-row:2}.dpad.down{grid-column:2;grid-row:2}.dpad.right{grid-column:3;grid-row:2}
.body{padding:2px 20px 14px;text-align:center}
.status{font:700 10.5px Karla;color:#9b7f6f;min-height:14px;margin-bottom:7px}
.status b{color:var(--deep)}
.btn{width:100%;border:0;border-radius:13px;padding:12px;background:var(--org);color:#fff;font:800 13px Rubik;cursor:pointer;box-shadow:0 5px 0 var(--deep)}
.btn:disabled{opacity:.55;box-shadow:none}
.legend{font-size:8.5px;color:#b8916c;margin-top:5px}
.ctlog{margin-top:8px;font:700 9.5px ui-monospace,monospace;color:#b8916c;background:#f7e8da;border-radius:8px;padding:6px 9px;text-align:left;min-height:28px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">TUNE TALK</div>
    <h1>Signal Trail 📶</h1>
    <p>Grow your trail on data bars. Each bar drops a mystery card — steer over it to flip a boost!</p>
  </div>
  <div class="hud"><span>Length: <span id="len">3</span></span><span>Boosts: <span id="boosts">0</span></span></div>
  <div class="stage"><canvas id="cv" width="240" height="240"></canvas></div>
  <div class="ctrls">
    <button class="dpad up" onclick="setDir(0,-1)">▲</button>
    <button class="dpad left" onclick="setDir(-1,0)">◀</button>
    <button class="dpad down" onclick="setDir(0,1)">▼</button>
    <button class="dpad right" onclick="setDir(1,0)">▶</button>
  </div>
  <div class="body">
    <div class="status" id="status">Tap Start, then steer the trail!</div>
    <button class="btn" id="start">START</button>
    <div class="legend">📶 data bar · ❓ mystery card · flip cards for boosts (real odds, no tricks)</div>
    
  </div>
</div></div>
<script>
/* Spec E: snake (deque + dot-product guard) + flip-card. IP-neutral. Honest odds. */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const N=12,CELL=20;
let snake,snakeSet,dir,nextDir,food,cards,len,boosts,playing=false,loopT=null,won=false,speed=200;
function ct(ev,p){console.log('CleverTap:',ev,p);}
function key(x,y){return x+','+y;}
function reset(){snake=[{x:5,y:6},{x:4,y:6},{x:3,y:6}];snakeSet=new Set(snake.map(s=>key(s.x,s.y)));
 dir={x:1,y:0};nextDir={x:1,y:0};len=3;boosts=0;won=false;speed=200;cards=[];placeFood();
 document.getElementById('len').textContent='3';document.getElementById('boosts').textContent='0';}
function placeFood(){let ok=false;while(!ok){food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};
 ok=!snakeSet.has(key(food.x,food.y))&&!cards.some(c=>c.x===food.x&&c.y===food.y);}}
function spawnCard(){let ok=false,p;let tries=0;while(!ok&&tries<40){tries++;
 p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};
 ok=!snakeSet.has(key(p.x,p.y))&&!cards.some(c=>c.x===p.x&&c.y===p.y)&&!(food.x===p.x&&food.y===p.y);}
 if(ok)cards.push({x:p.x,y:p.y});}
// HONEST card outcomes (Spec E table, no manipulation)
const CARD_OUTCOMES=[
 {t:'x2 Score',emo:'✨',w:50,fn:()=>{boosts++;document.getElementById('boosts').textContent=boosts;}},
 {t:'Slow Down',emo:'🐢',w:20,fn:()=>{speed=Math.min(speed+60,320);}},
 {t:'Speed Up',emo:'⚡',w:20,fn:()=>{speed=Math.max(speed-40,90);}},
 {t:'Trim',emo:'✂️',w:10,fn:()=>{if(snake.length>3){const removed=snake.splice(Math.ceil(snake.length/2));
   removed.forEach(s=>snakeSet.delete(key(s.x,s.y)));len=snake.length;document.getElementById('len').textContent=len;}}}];
function flipCard(){const tot=CARD_OUTCOMES.reduce((a,c)=>a+c.w,0);let r=Math.random()*tot,pick=CARD_OUTCOMES[0];
 for(const c of CARD_OUTCOMES){if(r<c.w){pick=c;break;}r-=c.w;}
 pick.fn();ct('card_flipped',{outcome:pick.t});
 status.innerHTML='Card: '+pick.emo+' <b>'+pick.t+'</b>!';
 // restart loop at possibly-new speed
 if(playing){clearInterval(loopT);loopT=setInterval(step,speed);}}
function setDir(x,y){if(x===-dir.x&&y===-dir.y)return;nextDir={x,y};} // dot-product guard
function step(){if(!playing)return;dir=nextDir;
 const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(head.x<0||head.x>=N||head.y<0||head.y>=N||snakeSet.has(key(head.x,head.y))){return dead();}
 snake.unshift(head);snakeSet.add(key(head.x,head.y));
 // card flip on entry
 const ci=cards.findIndex(c=>c.x===head.x&&c.y===head.y);
 if(ci>=0){cards.splice(ci,1);flipCard();}
 if(head.x===food.x&&head.y===food.y){len++;document.getElementById('len').textContent=len;
  ct('food_eaten',{length:len});placeFood();spawnCard();
  if(len>=14&&!won){won=true;return winGame();}}
 else{const tail=snake.pop();snakeSet.delete(key(tail.x,tail.y));}
 draw();}
function draw(){cx.clearRect(0,0,cv.width,cv.height);
 cx.font='15px serif';cx.textAlign='center';cx.textBaseline='middle';
 cx.fillText('📶',food.x*CELL+CELL/2,food.y*CELL+CELL/2);
 cards.forEach(c=>{cx.fillStyle='#7C3AED';cx.fillRect(c.x*CELL+3,c.y*CELL+3,CELL-6,CELL-6);
  cx.fillStyle='#fff';cx.fillText('❓',c.x*CELL+CELL/2,c.y*CELL+CELL/2);});
 snake.forEach((s,i)=>{cx.fillStyle=i===0?'#C2511A':CONFIG.accentColor;cx.fillRect(s.x*CELL+2,s.y*CELL+2,CELL-4,CELL-4);});}
function start(){reset();playing=true;status.textContent='Eat bars, flip cards, grow to 14!';
 document.getElementById('start').style.display='none';
 if(loopT)clearInterval(loopT);loopT=setInterval(step,speed);
 ct('game_started',{game:'signal_trail'});}
function dead(){playing=false;clearInterval(loopT);
 status.innerHTML='Trail lost! Length <b>'+len+'</b>, boosts <b>'+boosts+'</b>';
 const b=document.getElementById('start');b.style.display='block';b.textContent='TRY AGAIN';b.disabled=false;b.onclick=start;
 ct('game_over',{length:len,boosts:boosts,trail_best:len});}
function winGame(){playing=false;clearInterval(loopT);draw();
 status.innerHTML='🎉 Full signal! Length <b>'+len+'</b>';
 const b=document.getElementById('start');b.style.display='block';b.textContent='CLAIM DATA REWARD 📶';b.disabled=false;
 ct('milestone_reached',{trail_best:len});
 b.onclick=()=>{ct('reward_won',{reward:'bonus_data'});b.textContent='DATA ADDED ✓';b.disabled=true;};}
document.getElementById('start').onclick=start;
reset();draw();
window.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
 if(m[e.key])setDir(m[e.key][0],m[e.key][1]);});
ct('Notification Viewed',{game:'signal_trail',mechanic:'snake_plus_flipcard',spec:'E'});
</script></body></html>
