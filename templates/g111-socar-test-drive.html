<!DOCTYPE html>
<!-- ============================================================
  G111 — SOCAR MALAYSIA "TEST-DRIVE A SOCAR" · Guided Exploration
  Tier-3 Concept #15 · Pattern P-F (Samsung iTest, Spikes Asia 2022 — hands-on
  exploration before commitment)
  Surface: Custom HTML In-App · Grade B
  Lifecycle: engagement → first-booking activation
  SETS: {{profile.features_explored}} + {{profile.intent_score}} →
  "Ready for the real drive?" push. PROMOS: first-trip credit.
  Brand: SOCAR green (approx — verify)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#00b14f"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOCAR · Test-Drive a SOCAR</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--grn:var(--cfg-accent,#00b14f);--deep:#00833B;--ink:#0C1F14;--paper:#F1FBF5;--soft:#D6F0E0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;min-height:100vh;background:linear-gradient(165deg,#0d2c1b,#06150d);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(5,16,10,.62);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:24px;box-shadow:0 26px 64px rgba(5,21,13,.5);overflow:hidden}
.hd{background:var(--grn);color:#fff;padding:16px 20px;position:relative;text-align:center}
.brand{font:800 12px Sora;letter-spacing:2px;margin-bottom:5px}
.x{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.18);color:#fff;cursor:pointer}
h1{font-family:Sora;font-weight:800;font-size:19px}
.hd p{font-size:11.5px;opacity:.93;margin-top:4px;line-height:1.45}
.prog{display:flex;align-items:center;gap:8px;padding:13px 20px 4px}
.bar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--grn);border-radius:4px;transition:.5s}
.pct{font:800 11px Sora;color:var(--grn)}
.car{position:relative;margin:6px 18px 0;height:188px;background:linear-gradient(160deg,#e6f7ee,#cdeede);border-radius:16px;border:2px solid var(--soft);overflow:hidden}
.hot{position:absolute;width:46px;height:46px;border-radius:50%;background:#fff;border:2.5px solid var(--grn);display:flex;align-items:center;justify-content:center;font-size:21px;cursor:pointer;transition:.2s;box-shadow:0 4px 12px rgba(0,177,79,.25)}
.hot:active{transform:scale(.9)}
.hot.done{background:var(--grn);border-color:var(--deep);animation:none}
.hot.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,177,79,.4)}50%{box-shadow:0 0 0 9px rgba(0,177,79,0)}}
.carbase{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:74px;filter:drop-shadow(0 8px 10px rgba(0,80,40,.2))}
.info{margin:10px 18px 0;background:#fff;border:2px solid var(--soft);border-radius:13px;padding:12px 14px;min-height:58px}
.info b{font-size:13px;color:var(--ink);display:block;margin-bottom:2px}
.info span{font-size:11.5px;color:#5a766c;line-height:1.5}
.body{padding:12px 20px 18px;text-align:center}
.btn{width:100%;border:0;border-radius:13px;padding:14px;background:var(--grn);color:#fff;font:800 14px Sora;cursor:pointer;box-shadow:0 5px 0 var(--deep);opacity:.45;pointer-events:none;transition:.3s}
.btn.ready{opacity:1;pointer-events:auto}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--deep)}
.ctlog{margin-top:10px;font:700 10.5px ui-monospace,monospace;color:#8aa89c;background:#e3f3eb;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">SOCAR</div>
    <h1>Test-drive a SOCAR 🚗</h1>
    <p>No keys needed yet. Tap around the car to see how easy car-sharing really is.</p>
  </div>
  <div class="prog"><div class="bar"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div>
  <div class="car" id="car">
    <div class="carbase">🚙</div>
    <div class="hot pulse" style="left:8%;top:18%" onclick="explore('unlock',this)">🔓</div>
    <div class="hot pulse" style="left:78%;top:16%" onclick="explore('boot',this)">🧳</div>
    <div class="hot pulse" style="left:10%;top:66%" onclick="explore('fuel',this)">⛽</div>
    <div class="hot pulse" style="left:80%;top:66%" onclick="explore('trip',this)">🗺️</div>
  </div>
  <div class="info" id="info"><b>Four things to discover</b><span>Tap each glowing point to explore. See everything to unlock your first drive.</span></div>
  <div class="body">
    <button class="btn" id="go">READY FOR THE REAL DRIVE →</button>
    
  </div>
</div></div>
<script>
/* P-F iTest-style exploration. SETS profile.features_explored + intent_score. */
const FEATURES={
 unlock:{b:'🔓 Keyless unlock',s:'Tap "unlock" in the app when you reach the car. No counter, no keys, no queue.'},
 boot:{b:'🧳 Boot space',s:'IKEA run? Beach trip? Airport drop? There\'s room for the whole plan.'},
 fuel:{b:'⛽ Fuel included',s:'Petrol\'s on us — there\'s a fuel card in every car. Just drive.'},
 trip:{b:'🗺️ Plan your trip',s:'Book by the hour or the day. The road-trip planner does the maths for you.'}};
let explored=0,seen={};
function ct(ev,p){console.log('CleverTap:',ev,p);}
function explore(key,el){if(seen[key])return;seen[key]=true;explored++;
 el.classList.remove('pulse');el.classList.add('done');el.textContent='✓';
 const F=FEATURES[key];
 info.innerHTML='<b>'+F.b+'</b><span>'+F.s+'</span>';
 const pc=Math.round(explored/4*100);fill.style.width=pc+'%';pct.textContent=pc+'%';
 ct('feature_tapped',{feature:key,explored:explored});
 if(explored===4){go.classList.add('ready');
  info.innerHTML='<b>You\'ve seen it all! 🎉</b><span>Keyless, fuelled, spacious, simple. Ready to take a real one out?</span>';
  /* SETS profile.features_explored + intent_score */
  ct('exploration_complete',{features_explored:4,intent_score:'high'});
  go.onclick=()=>{ /* PROMOS: first-trip credit */
   ct('first_drive_cta',{intent_score:'high'});
   go.textContent='OPENING BOOKING ✓';go.disabled=true;};}}
ct('Notification Viewed',{experience:'test_drive',audience:'unactivated'});
</script></body></html>
