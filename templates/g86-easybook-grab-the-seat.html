<!DOCTYPE html>
<!-- ============================================================
  G86 — EASYBOOK "GRAB THE BEST SEAT" · Speed-Tap Seat Picker
  Surface: Custom HTML In-App · Grade A → B
  Behavioral: scarcity reflex (good seats vanish) — mirrors real booking rush
  Lifecycle: engagement → booking conversion
  Mechanic: bus seat map; premium seats flash green, tap before they're taken.
  PROMOS: grab 5 premium → seat-upgrade voucher. Brand: Easybook blue (verify)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#7d99b5"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easybook · Grab the Best Seat</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&family=Karla:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1B6BB5;--deep:#114a80;--org:#F7941D;--ink:#0E2A42;--paper:#F6FAFE}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Karla,sans-serif;min-height:100vh;background:linear-gradient(165deg,#11406b,#081f36);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(4,14,25,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
.hd{background:var(--blue);color:#fff;padding:15px 18px;position:relative;text-align:center}
.brand{font:800 11px Karla;letter-spacing:3px;margin-bottom:4px;opacity:.95}
.x{position:absolute;top:11px;right:12px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.2);color:#fff;cursor:pointer}
h1{font-family:Rubik;font-size:19px;font-weight:800}
.hd p{font-size:11px;opacity:.94;margin-top:3px}
.bar{display:flex;justify-content:space-between;padding:8px 24px 2px;font:800 11.5px Karla;color:var(--cfg-accent,#7d99b5)}
.bar b{color:var(--blue)}
.buswrap{display:flex;justify-content:center;padding:8px 0 4px}
.bus{background:#dfeaf5;border:2px solid #c5d9ec;border-radius:16px 16px 10px 10px;padding:14px 12px 12px;position:relative}
.bus::before{content:'🚌 DRIVER';position:absolute;top:-2px;left:12px;font:800 8px Karla;color:var(--cfg-accent,#7d99b5)}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.seat{width:38px;height:38px;border-radius:9px;background:#fff;border:2px solid #cdddec;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:.12s}
.seat.premium{background:#FFF3D6;border-color:var(--org);animation:gpulse 1s infinite}
@keyframes gpulse{50%{box-shadow:0 0 0 4px rgba(247,148,29,.25)}}
.seat.grabbed{background:#2f9e6e;border-color:#2f9e6e;animation:none}
.seat.taken{background:#e35d5d;border-color:#e35d5d;opacity:.7;animation:none}
.gap{width:38px}
.body{padding:8px 20px 16px;text-align:center}
.result{display:none;margin-bottom:9px}
.result b{font-family:Rubik;font-size:17px;font-weight:800;color:var(--blue);display:block}
.result span{font-size:12px;color:#6b87a3}
.btn{width:100%;border:0;border-radius:13px;padding:13px;background:var(--org);color:#fff;font:800 14px Rubik;cursor:pointer;box-shadow:0 5px 0 #c46f08}
.ctlog{margin-top:10px;font:700 10.5px ui-monospace,monospace;color:var(--cfg-accent,#7d99b5);background:#e7f0f8;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">EASYBOOK</div>
    <h1>GRAB THE BEST SEAT 💺</h1>
    <p>Premium seats glow orange — tap fast before other passengers take them! 15 seconds.</p>
  </div>
  <div class="bar"><span>GRABBED <b id="gr">0</b></span><span>TIME <b id="tm">15</b>s</span></div>
  <div class="buswrap"><div class="bus"><div class="seats" id="seats"></div></div></div>
  <div class="body">
    <div class="result" id="result"><b id="rT"></b><span id="rS"></span></div>
    <button class="btn" id="go">BOARD THE BUS</button>
    
  </div>
</div></div>
<script>
/* Scarcity reflex: grab premium before auto-taken. 5+ → Promos seat upgrade. */
const ROWS=7;let seats=[],grabbed=0,time=15,running=false,timers=[];
function ct(ev,p){console.log('CleverTap:',ev,p);}
function build(){seats=[];document.getElementById('seats').innerHTML='';
 for(let r=0;r<ROWS;r++){
  for(let c=0;c<4;c++){
   if(c===2){const g=document.createElement('div');g.className='gap';document.getElementById('seats').appendChild(g);}
   const s=document.createElement('div');s.className='seat';s.textContent='💺';
   const obj={el:s,state:'free'};
   s.onclick=()=>grab(obj);document.getElementById('seats').appendChild(s);seats.push(obj);}}}
function grab(o){if(!running)return;
 if(o.state==='premium'){o.state='grabbed';o.el.className='seat grabbed';o.el.textContent='✓';
  grabbed++;gr.textContent=grabbed;ct('seat_grabbed',{grabbed:grabbed});}}
function flash(){if(!running)return;
 const free=seats.filter(s=>s.state==='free');
 if(!free.length)return;
 const s=free[Math.floor(Math.random()*free.length)];
 s.state='premium';s.el.className='seat premium';s.el.textContent='⭐';
 setTimeout(()=>{if(s.state==='premium'){ // someone else took it
   s.state='taken';s.el.className='seat taken';s.el.textContent='✗';}},1100);}
go.onclick=()=>{if(running)return;
 running=true;grabbed=0;time=15;gr.textContent=0;tm.textContent=15;
 build();result.style.display='none';go.textContent='GRAB! GRAB! GRAB!';
 ct('Game Played',{game:'grab_the_seat'});
 timers.push(setInterval(flash,520));
 timers.push(setInterval(()=>{time--;tm.textContent=time;if(time<=0)end();},1000));};
function end(){running=false;timers.forEach(clearInterval);timers=[];
 result.style.display='block';
 const win=grabbed>=5;
 rT.textContent=grabbed+' PREMIUM SEATS GRABBED!';
 rS.textContent=win?'Lightning reflexes! 5+ grabs earns a seat-upgrade voucher on your next trip. 💺':
  'Those seats go FAST (just like real life). Grab 5 for the upgrade voucher — rematch?';
 go.textContent=win?'CLAIM SEAT-UPGRADE VOUCHER →':'BOARD AGAIN';
 ct('game_over',{grabbed:grabbed,reward:win?'seat_upgrade':'none'});
 if(win)go.onclick=()=>{ct('reward_claimed',{reward:'seat_upgrade'});
  go.textContent='SAVED ✓';go.disabled=true;};
 else go.onclick=()=>location.reload();}
build();
ct('Notification Viewed',{game:'grab_the_seat',trigger:'booking_nudge'});
</script></body></html>
