<!DOCTYPE html>
<!-- ============================================================
  G118 — M1 "THE DAILY COMMUTE COMPANION" · Wellness Micro-Story
  Tier-3 Concept #13 · Pattern P-G (light daily check-in, reflective mood arc)
  Surface: Custom HTML In-App micro-story · Grade B
  Lifecycle: habit / daily-return (engagement, gentle)
  SETS: {{profile.checkin_streak}} → encouragement push.
  Tone: warm, low-pressure wellness (not salesy). Brand: M1 orange/magenta (verify)
============================================================ -->
<html lang="en"><head>
<script>
const CONFIG = {
  accentColor: "#b88a9a"
};
try{document.documentElement.style.setProperty("--cfg-accent",CONFIG.accentColor);}catch(e){}
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 · Daily Commute Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Mulish:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--org:#FF6B2C;--mag:#E5007D;--ink:#241019;--paper:#FFF6F1;--soft:#FCE3D8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Mulish,sans-serif;min-height:100vh;background:linear-gradient(165deg,#2c1018,#160810);display:flex;align-items:center;justify-content:center}
.backdrop{position:fixed;inset:0;background:rgba(16,5,10,.6);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:88vw;max-width:358px;background:var(--paper);border-radius:24px;box-shadow:0 26px 64px rgba(20,8,14,.5);overflow:hidden}
.hd{padding:17px 20px 6px;position:relative;text-align:center}
.brand{font:700 11px Mulish;letter-spacing:3px;color:var(--mag);margin-bottom:5px}
.x{position:absolute;top:13px;right:13px;width:30px;height:30px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer}
h1{font-family:Fraunces;font-size:22px;color:var(--ink)}
.hd p{font-size:11.5px;color:#9a7080;margin-top:4px;line-height:1.5}
.week{display:flex;justify-content:center;gap:7px;padding:12px 0 4px}
.day{width:34px;text-align:center}
.day .ring{width:30px;height:30px;margin:0 auto;border-radius:50%;border:2px solid #ecccd9;display:flex;align-items:center;justify-content:center;font-size:14px;background:#fff;transition:.3s}
.day.done .ring{background:linear-gradient(135deg,var(--org),var(--mag));border-color:var(--mag);color:#fff}
.day.today .ring{border-color:var(--mag);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,0,125,.4)}50%{box-shadow:0 0 0 6px rgba(229,0,125,0)}}
.day small{font:700 8.5px Mulish;color:var(--cfg-accent,#b88a9a);display:block;margin-top:3px}
.prompt{margin:8px 22px 0;text-align:center}
.prompt .q{font-family:Fraunces;font-size:17px;color:var(--ink);line-height:1.4;margin-bottom:12px}
.moods{display:flex;justify-content:center;gap:10px}
.mood{width:52px;height:52px;border-radius:14px;border:2px solid var(--soft);background:#fff;font-size:25px;cursor:pointer;transition:.18s}
.mood:hover{border-color:var(--mag)}
.mood:active{transform:scale(.92)}
.mood.sel{border-color:var(--mag);background:#fff0f6}
.resp{display:none;margin:12px 22px 0;background:#fff;border:2px solid var(--soft);border-radius:14px;padding:14px;text-align:center}
.resp b{font-family:Fraunces;font-size:15px;color:var(--mag);display:block;margin-bottom:4px}
.resp span{font-size:12px;color:#8a6070;line-height:1.55}
.body{padding:14px 20px 18px;text-align:center}
.streakcap{font:700 10px Mulish;letter-spacing:1.5px;color:var(--cfg-accent,#b88a9a);text-transform:uppercase}
.streakcap b{color:var(--mag);font-size:13px}
.btn{width:100%;border:0;border-radius:13px;padding:13px;background:linear-gradient(135deg,var(--org),var(--mag));color:#fff;font:700 13.5px Mulish;cursor:pointer;margin-top:10px;display:none}
.ctlog{margin-top:10px;font:700 10.5px ui-monospace,monospace;color:var(--cfg-accent,#b88a9a);background:#f8e6ee;border-radius:8px;padding:7px 10px;text-align:left;min-height:30px}
</style></head><body>
<div class="backdrop"><div class="card">
  <div class="hd">
    <button class="x" onclick="ct('Notification Dismissed',{})">✕</button>
    <div class="brand">M1</div>
    <h1>Your Commute Companion 🚇</h1>
    <p>A quiet daily check-in for the journey. No scores, no pressure — just a moment for you.</p>
  </div>
  <div class="week" id="week"></div>
  <div class="prompt">
    <div class="q">How's your journey feeling today?</div>
    <div class="moods">
      <button class="mood" onclick="checkin('rough',this)">😮‍💨</button>
      <button class="mood" onclick="checkin('ok',this)">😌</button>
      <button class="mood" onclick="checkin('good',this)">😊</button>
      <button class="mood" onclick="checkin('great',this)">✨</button>
    </div>
  </div>
  <div class="resp" id="resp"><b></b><span></span></div>
  <div class="body">
    <div class="streakcap">Check-in streak: <b id="streakN">4</b> days</div>
    <button class="btn" id="go">SEE THIS WEEK'S ARC →</button>
    
  </div>
</div></div>
<script>
/* P-G wellness micro-story (low pressure). SETS profile.checkin_streak → encouragement.
   Demo shows a 4-day existing streak; today's check-in extends it. */
const DAYS=['M','T','W','T','F'];let priorStreak=4;
const RESP={
 rough:{b:'Rough mornings happen 🫶',s:'Thanks for showing up anyway. A tough commute doesn\'t define the day ahead. Breathe — you\'ve got this.'},
 ok:{b:'Steady is good 🌿',s:'Not every day needs to sparkle. Steady and calm is a win in its own right. Glad you checked in.'},
 good:{b:'Love that 😊',s:'A good journey sets a good tone. Carry that feeling into whatever\'s next today.'},
 great:{b:'What a start! ✨',s:'Days like this are worth noticing. Hold onto that spark — and pass a little of it on.'}};
function ct(ev,p){console.log('CleverTap:',ev,p);}
function renderWeek(done){week.innerHTML=DAYS.map((d,i)=>{
 let cls='day';if(i<priorStreak)cls+=' done';else if(i===priorStreak&&done)cls+=' done';else if(i===priorStreak)cls+=' today';
 const ic=(i<priorStreak||(i===priorStreak&&done))?'✓':'·';
 return `<div class="${cls}"><div class="ring">${ic}</div><small>${d}</small></div>`;
}).join('');}
let checked=false;
function checkin(mood,el){if(checked)return;checked=true;
 document.querySelectorAll('.mood').forEach(m=>m.classList.remove('sel'));el.classList.add('sel');
 const R=RESP[mood];resp.style.display='block';
 resp.querySelector('b').textContent=R.b;resp.querySelector('span').textContent=R.s;
 const newStreak=priorStreak+1;streakN.textContent=newStreak;
 renderWeek(true);
 go.style.display='block';
 /* SETS profile.checkin_streak → encouragement push */
 ct('daily_checkin',{mood:mood,checkin_streak:newStreak});
 go.onclick=()=>{ct('arc_viewed',{checkin_streak:newStreak});
  go.textContent='SEE YOU TOMORROW ✓';go.disabled=true;};}
renderWeek(false);
ct('Notification Viewed',{experience:'commute_companion',trigger:'morning_commute'});
</script></body></html>
